<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひとりマップ</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f5f5f5;
}
header {
  background: white;
  padding: 20px;
  text-align: center;
}
h1 {
  margin: 0;
}
.container {
  padding: 20px;
}
.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  box-sizing: border-box;
}
.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 20px;
}
.category {
  background: white;
  padding: 22px;
  border-radius: 15px;
  text-align: center;
  font-size: 18px;
}
.map {
  margin-top: 20px;
  height: 250px;
  background: #ddd;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
}
</style>
</head>

<body>

<header>
<h1>ひとりマップ</h1>
<p>一人で、どこ行く？</p>
</header>

<div class="container">

<input class="search" placeholder="一人で行きたい場所を検索">

<div class="categories">

<div class="category">🍜<br>ご飯</div>
<div class="category">☕<br>カフェ</div>
<div class="category">🎬<br>映画</div>
<div class="category">♨️<br>温泉</div>
<div class="category">🎤<br>カラオケ</div>
<div class="category">🎮<br>遊ぶ</div>
<div class="category">🚗<br>ドライブ</div>
<div class="category">🌳<br>お出かけ</div>

</div>

<div class="map">
📍 地図はここに表示
</div>

</div>

</body>
</html>
