<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#f7f9fa">
<title>ohitorisamap｜おひとりさまっぷ</title>

<style>
/* =========================================
   BASE
========================================= */

:root{
  --bg:#f7f9fa;
  --surface:#ffffff;
  --surface2:#f1f5f6;
  --line:#e4eaed;

  --text:#172126;
  --sub:#718087;
  --accent:#55bfd3;
  --accent-dark:#2498ad;

  --shadow:0 8px 28px rgba(25,45,55,.08);
  --radius:20px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
}

body{
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  position:relative;
  width:100%;
  max-width:430px;
  height:100dvh;
  margin:0 auto;
  background:var(--bg);
  overflow:hidden;
}


/* =========================================
   OPENING
========================================= */

#opening{
  position:absolute;
  z-index:9999;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f7f9fa;
  overflow:hidden;
}

.opening-inner{
  position:relative;
  width:270px;
  height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* レーダー本体 */

.opening-radar{
  position:absolute;
  width:190px;
  height:190px;
  border:1px solid rgba(65,180,201,.35);
  border-radius:50%;
  opacity:0;
  transform:scale(.65);
  animation:radarAppear .55s ease forwards;
}

.opening-radar::before,
.opening-radar::after{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid rgba(65,180,201,.13);
  border-radius:50%;
}

.opening-radar::after{
  inset:48px;
}

.opening-cross-x,
.opening-cross-y{
  position:absolute;
  background:rgba(65,180,201,.13);
}

.opening-cross-x{
  width:100%;
  height:1px;
  left:0;
  top:50%;
}

.opening-cross-y{
  width:1px;
  height:100%;
  left:50%;
  top:0;
}

/* レーダーのスキャン */

.opening-sweep{
  position:absolute;
  width:95px;
  height:95px;
  left:50%;
  top:50%;
  transform-origin:0 0;
  background:linear-gradient(
    90deg,
    rgba(77,200,220,.34),
    rgba(77,200,220,0)
  );
  clip-path:polygon(0 0,100% -2%,100% 4%,0 0);
  opacity:0;
  animation:
    sweepAppear .2s .55s forwards,
    sweepRotate 1.25s .7s linear forwards;
}

/* 光る発見ポイント */

.opening-target{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#54c9df;
  box-shadow:
    0 0 0 4px rgba(84,201,223,.12),
    0 0 18px rgba(84,201,223,.5);
  left:calc(50% + 47px);
  top:calc(50% - 31px);
  opacity:0;
  transform:scale(.2);
  animation:
    targetAppear .25s 1.55s ease forwards,
    targetGlow .55s 1.8s ease forwards;
}

/* 中心の光 */

.opening-light{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 25px rgba(80,196,216,.7);
  opacity:0;
  animation:
    centerLight .45s 1.9s ease forwards,
    centerLightMove .65s 2.35s ease forwards;
}

/* ロゴ */

.opening-logo{
  position:absolute;
  text-align:center;
  opacity:0;
  transform:translateY(12px);
  animation:logoAppear .65s 2.45s ease forwards;
}

.opening-logo-main{
  font-size:28px;
  font-weight:700;
  letter-spacing:.04em;
}

.opening-logo-sub{
  margin-top:8px;
  font-size:13px;
  color:var(--sub);
  letter-spacing:.12em;
}

.opening-tagline{
  margin-top:17px;
  font-size:11px;
  color:#85949a;
  letter-spacing:.06em;
  opacity:0;
  animation:taglineAppear .5s 2.8s ease forwards;
}

/* オープニング終了 */

#opening.hide{
  animation:openingOut .65s ease forwards;
  pointer-events:none;
}

@keyframes radarAppear{
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes sweepAppear{
  to{opacity:1;}
}

@keyframes sweepRotate{
  from{transform:rotate(-35deg);}
  to{transform:rotate(325deg);}
}

@keyframes targetAppear{
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes targetGlow{
  50%{
    transform:scale(1.8);
  }
  100%{
    transform:scale(1);
  }
}

@keyframes centerLight{
  to{opacity:1;}
}

@keyframes centerLightMove{
  to{
    transform:scale(7);
    opacity:.05;
  }
}

@keyframes logoAppear{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes taglineAppear{
  to{opacity:1;}
}

@keyframes openingOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}


/* =========================================
   HEADER
========================================= */

.header{
  height:72px;
  padding:20px 20px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  cursor:pointer;
}

.brand-en{
  font-size:17px;
  font-weight:700;
  letter-spacing:.04em;
}

.brand-jp{
  margin-top:2px;
  font-size:10px;
  color:var(--sub);
  letter-spacing:.12em;
}

.header-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#52636a;
}


/* =========================================
   PAGES
========================================= */

.page{
  position:absolute;
  inset:72px 0 76px;
  padding:0 20px;
  overflow-y:auto;
  overflow-x:hidden;
  display:none;
  scrollbar-width:none;
}

.page::-webkit-scrollbar{
  display:none;
}

.page.active{
  display:block;
}


/* =========================================
   HOME
========================================= */

.hero{
  padding:24px 0 20px;
}

.hero-title{
  margin:0;
  font-size:27px;
  line-height:1.45;
  letter-spacing:.01em;
}

.hero-text{
  margin:10px 0 0;
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
}

/* search */

.search-box{
  width:100%;
  height:54px;
  padding:0 17px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:11px;
  color:#738189;
  text-align:left;
}

.search-icon{
  font-size:18px;
}

.search-placeholder{
  font-size:14px;
}

/* section */

.section{
  margin-top:28px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title{
  font-size:16px;
  font-weight:700;
}

.section-more{
  color:var(--accent-dark);
  font-size:12px;
  background:none;
}

/* categories */

.categories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:3px 1px 8px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 72px;
  background:none;
  text-align:center;
}

.category-icon{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:18px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 5px 16px rgba(20,45,55,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  transition:.2s;
}

.category:active .category-icon{
  transform:scale(.93);
}

.category-name{
  margin-top:8px;
  font-size:11px;
  color:#56656b;
}

/* recommendations */

.recommendations{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding:2px 1px 9px;
  scrollbar-width:none;
}

.recommendations::-webkit-scrollbar{
  display:none;
}

.place-card{
  flex:0 0 210px;
  overflow:hidden;
  border-radius:18px;
  background:#fff;
  box-shadow:var(--shadow);
  text-align:left;
}

.place-image{
  position:relative;
  height:126px;
  background:
    linear-gradient(135deg,#d9edf0,#8dc5cf);
}

.place-image.cafe{
  background:
    linear-gradient(135deg,#eadfd2,#b99d82);
}

.place-image.movie{
  background:
    linear-gradient(135deg,#d7d8e8,#8b91b6);
}

.place-image.hot{
  background:
    linear-gradient(135deg,#ead6d0,#bc8d83);
}

.place-image.drive{
  background:
    linear-gradient(135deg,#dce4d3,#8fa47d);
}

.place-image.shop{
  background:
    linear-gradient(135deg,#e3d8eb,#aa91bc);
}

.place-info{
  padding:13px;
}

.place-name{
  font-size:14px;
  font-weight:700;
}

.place-meta{
  margin-top:6px;
  font-size:11px;
  color:var(--sub);
}

.rating{
  color:#e9a93a;
}


/* =========================================
   MAP PREVIEW
========================================= */

.map-preview{
  position:relative;
  height:190px;
  overflow:hidden;
  border-radius:20px;
  background:#e9eff0;
  box-shadow:var(--shadow);
  cursor:pointer;
}

.map-block{
  position:absolute;
  background:#dbe4e5;
  border-radius:4px;
}

.road{
  position:absolute;
  background:#fff;
  transform-origin:center;
}

.road.one{
  width:150%;
  height:19px;
  left:-20%;
  top:43%;
  transform:rotate(-17deg);
}

.road.two{
  width:130%;
  height:13px;
  left:-10%;
  top:65%;
  transform:rotate(24deg);
}

.road.three{
  width:12px;
  height:120%;
  left:54%;
  top:-10%;
  transform:rotate(13deg);
}

.map-location{
  position:absolute;
  width:17px;
  height:17px;
  left:50%;
  top:49%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:var(--accent-dark);
  border:4px solid #fff;
  box-shadow:0 3px 10px rgba(0,80,100,.2);
}

.map-location::after{
  content:"";
  position:absolute;
  inset:-10px;
  border:1px solid rgba(45,164,185,.28);
  border-radius:50%;
}

.map-label{
  position:absolute;
  left:13px;
  bottom:13px;
  padding:7px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.9);
  font-size:11px;
  color:#58676c;
}


/* =========================================
   SEARCH PAGE
========================================= */

.search-large{
  margin-top:18px;
  display:flex;
  align-items:center;
  height:55px;
  padding:0 16px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:17px;
  box-shadow:var(--shadow);
}

.search-large input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:none;
  font-size:15px;
  color:var(--text);
}

.search-large button{
  background:none;
  color:var(--accent-dark);
  font-size:18px;
}

.tag-list{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.tag{
  padding:10px 14px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
  color:#53636a;
  font-size:12px;
}

.search-results{
  margin-top:20px;
}

.result-card{
  width:100%;
  padding:15px;
  margin-bottom:10px;
  border-radius:16px;
  background:#fff;
  box-shadow:0 5px 18px rgba(20,45,55,.06);
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
}

.result-thumb{
  flex:0 0 60px;
  height:60px;
  border-radius:13px;
  background:linear-gradient(135deg,#d7ebee,#94cad3);
}

.result-name{
  font-size:14px;
  font-weight:700;
}

.result-info{
  margin-top:5px;
  font-size:11px;
  color:var(--sub);
}

.no-result{
  padding:30px 10px;
  text-align:center;
  color:var(--sub);
  font-size:13px;
}


/* =========================================
   FULL MAP
========================================= */

#mapPage{
  padding:0;
}

.full-map{
  position:absolute;
  inset:0;
  background:#e5ecec;
  overflow:hidden;
}

.full-map .map-block{
  opacity:.9;
}

.pin{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50% 50% 50% 5px;
  transform:rotate(-45deg);
  background:#fff;
  box-shadow:0 5px 15px rgba(30,60,70,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.pin span{
  transform:rotate(45deg);
  font-size:14px;
}

.map-top{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  gap:10px;
}

.map-back{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  box-shadow:var(--shadow);
  font-size:20px;
}

.map-search{
  flex:1;
  height:42px;
  border-radius:14px;
  background:#fff;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  padding:0 14px;
  color:#78868b;
  font-size:13px;
}

.location-button{
  position:absolute;
  right:18px;
  bottom:90px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#fff;
  box-shadow:var(--shadow);
  font-size:19px;
}


/* =========================================
   FAVORITES
========================================= */

.favorite-empty{
  margin-top:70px;
  text-align:center;
  color:var(--sub);
}

.favorite-empty-icon{
  font-size:40px;
  margin-bottom:15px;
}

.favorite-card{
  position:relative;
  width:100%;
  margin-bottom:12px;
  padding:15px;
  background:#fff;
  border-radius:17px;
  box-shadow:var(--shadow);
  text-align:left;
}

.favorite-card-name{
  font-size:15px;
  font-weight:700;
}

.favorite-card-meta{
  margin-top:7px;
  font-size:11px;
  color:var(--sub);
}


/* =========================================
   MY PAGE
========================================= */

.profile{
  margin-top:20px;
  padding:22px;
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  text-align:center;
}

.avatar{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:#e4f4f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.profile-name{
  margin-top:12px;
  font-size:17px;
  font-weight:700;
}

.profile-sub{
  margin-top:5px;
  font-size:11px;
  color:var(--sub);
}

.stats{
  display:flex;
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:17px;
}

.stat{
  flex:1;
  border-right:1px solid var(--line);
}

.stat:last-child{
  border:0;
}

.stat-number{
  font-size:18px;
  font-weight:700;
}

.stat-label{
  margin-top:4px;
  font-size:10px;
  color:var(--sub);
}

.setting-list{
  margin-top:20px;
  overflow:hidden;
  border-radius:18px;
  background:#fff;
  box-shadow:var(--shadow);
}

.setting{
  width:100%;
  min-height:56px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.setting:last-child{
  border-bottom:0;
}

.setting-left{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
}

.setting-arrow{
  color:#a0aaae;
}


/* =========================================
   DETAIL
========================================= */

#detailPage{
  padding:0 20px 20px;
}

.detail-back{
  margin-top:12px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  box-shadow:var(--shadow);
  font-size:20px;
}

.detail-image{
  height:220px;
  margin-top:15px;
  border-radius:21px;
  background:linear-gradient(135deg,#d6ebee,#86c5cf);
  box-shadow:var(--shadow);
}

.detail-category{
  margin-top:20px;
  font-size:11px;
  color:var(--accent-dark);
}

.detail-title{
  margin:6px 0 0;
  font-size:25px;
  line-height:1.4;
}

.detail-rating{
  margin-top:10px;
  font-size:13px;
}

.detail-description{
  margin-top:20px;
  color:#66757b;
  font-size:13px;
  line-height:1.9;
}

.detail-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.detail-action{
  flex:1;
  height:50px;
  border-radius:15px;
  background:#fff;
  border:1px solid var(--line);
  color:#526168;
}

.detail-action.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
  position:absolute;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding:7px 8px 9px;
  background:rgba(255,255,255,.96);
  border-top:1px solid rgba(30,55,65,.07);
  display:grid;
  grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;
  align-items:end;
}

.nav-item{
  height:56px;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#879398;
  font-size:10px;
}

.nav-icon{
  font-size:20px;
  line-height:1;
}

.nav-item.active{
  color:var(--accent-dark);
}

/* MAP */

.map-nav{
  position:relative;
  height:68px;
  margin-top:-21px;
  justify-content:flex-start;
  gap:3px;
}

.map-radar{
  position:absolute;
  width:60px;
  height:60px;
  top:-3px;
  border-radius:50%;
  background:#152c32;
  border:2px solid rgba(92,203,220,.7);
  box-shadow:
    0 7px 22px rgba(30,150,170,.22),
    0 0 16px rgba(80,196,215,.16);
  overflow:hidden;
}

.map-radar::before,
.map-radar::after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(112,218,231,.25);
}

.map-radar::before{
  inset:9px;
}

.map-radar::after{
  inset:20px;
}

.radar-line-x,
.radar-line-y{
  position:absolute;
  background:rgba(112,218,231,.17);
}

.radar-line-x{
  width:100%;
  height:1px;
  top:50%;
}

.radar-line-y{
  height:100%;
  width:1px;
  left:50%;
}

.radar-sweep{
  position:absolute;
  width:30px;
  height:30px;
  left:50%;
  top:50%;
  transform-origin:0 0;
  background:linear-gradient(
    90deg,
    rgba(113,224,235,.5),
    rgba(113,224,235,0)
  );
  clip-path:polygon(0 0,100% 0,100% 8%,0 0);
  animation:radarSpin 2.5s linear infinite;
}

.radar-dot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#a9f2ff;
  left:38px;
  top:20px;
  box-shadow:0 0 8px #76dbe9;
}

.map-nav-label{
  margin-top:65px;
  font-size:10px;
}

@keyframes radarSpin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}


/* =========================================
   TOAST
========================================= */

#toast{
  position:absolute;
  z-index:10000;
  left:50%;
  bottom:91px;
  transform:translate(-50%,15px);
  padding:11px 16px;
  border-radius:13px;
  background:rgba(25,40,45,.94);
  color:#fff;
  font-size:12px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =========================================
   SMALL SCREEN
========================================= */

@media(max-height:700px){
  .hero{
    padding-top:13px;
  }

  .section{
    margin-top:21px;
  }

  .place-image{
    height:110px;
  }
}
</style>
</head>

<body>

<div id="app">

<script>

/* =========================================
   DATA
========================================= */

const places = [

  {
    id:"solo-dining",
    name:"ひとりで入りやすい食事処",
    category:"食事",
    rating:"4.6",
    tags:["食事","ひとり焼肉"],
    description:
      "カウンター席があり、ひとりでも気軽に利用しやすいお店。落ち着いて自分のペースで食事を楽しみたいときにおすすめです。",
    type:""
  },

  {
    id:"blue-cafe",
    name:"静かなひとりカフェ",
    category:"カフェ",
    rating:"4.5",
    tags:["カフェ","ひとりカフェ"],
    description:
      "ゆっくり過ごしたい日におすすめのカフェ。ひとりでも入りやすく、読書や休憩にも向いています。",
    type:"cafe"
  },

  {
    id:"movie-place",
    name:"ひとり映画におすすめ",
    category:"映画",
    rating:"4.4",
    tags:["映画"],
    description:
      "ひとりで映画を楽しみたい人におすすめ。周りを気にせず、自分の時間を楽しめるスポットです。",
    type:"movie"
  },

  {
    id:"hot-spring",
    name:"ゆっくり過ごせる温泉",
    category:"温泉",
    rating:"4.7",
    tags:["温泉"],
    description:
      "ひとりでゆっくりリラックスしたい日におすすめの温泉スポットです。",
    type:"hot"
  },

  {
    id:"drive-place",
    name:"ひとりドライブスポット",
    category:"ドライブ",
    rating:"4.5",
    tags:["ドライブ","お出かけ"],
    description:
      "ひとりで気ままに走りたい日におすすめ。景色を楽しみながら、自分のペースで過ごせます。",
    type:"drive"
  },

  {
    id:"shopping-place",
    name:"ひとりで行きやすい買い物スポット",
    category:"買い物",
    rating:"4.3",
    tags:["買い物"],
    description:
      "ひとりでも気軽に立ち寄れる買い物スポットです。",
    type:"shop"
  }

];


/* =========================================
   STATE
========================================= */

let currentPage = "home";
let lastPage = "home";
let currentDetailId = null;

let favorites =
  JSON.parse(
    localStorage.getItem("ohitorisamapFavorites") || "[]"
  );


/* =========================================
   PAGE CONTROL
========================================= */

function goPage(page){

  if(page === "detail"){
    return;
  }

  if(currentPage !== "detail"){
    lastPage = currentPage;
  }

  currentPage = page;

  document.querySelectorAll(".page")
    .forEach(pageEl=>{
      pageEl.classList.remove("active");
    });

  const target =
    document.getElementById(page + "Page");

  if(target){
    target.classList.add("active");
  }

  document.querySelectorAll(".nav-item")
    .forEach(item=>{
      item.classList.remove("active");
    });

  const nav =
    document.getElementById("nav-" + page);

  if(nav){
    nav.classList.add("active");
  }

  if(page === "favorites"){
    renderFavorites();
  }

  if(page === "mypage"){
    updateFavoriteCount();
  }

  window.scrollTo(0,0);
}


/* =========================================
   DETAIL
========================================= */

function openDetail(id){

  const place =
    places.find(p=>p.id === id);

  if(!place){
    return;
  }

  lastPage = currentPage;
  currentPage = "detail";
  currentDetailId = id;

  document.querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById("detailPage")
    .classList.add("active");

  document.getElementById("detailTitle")
    .textContent = place.name;

  document.getElementById("detailCategory")
    .textContent = place.category;

  document.getElementById("detailRating")
    .innerHTML =
      `★ ${place.rating}　・　ひとり利用おすすめ`;

  document.getElementById("detailDescription")
    .textContent = place.description;

  const image =
    document.getElementById("detailImage");

  image.className =
    "detail-image " + (place.type || "");

  updateFavoriteButton();

}


function backFromDetail(){

  goPage(lastPage || "home");

}


/* =========================================
   FAVORITES
========================================= */

function toggleFavorite(){

  if(!currentDetailId){
    return;
  }

  const index =
    favorites.indexOf(currentDetailId);

  if(index === -1){

    favorites.push(currentDetailId);

    showToast("お気に入りに追加しました");

  }else{

    favorites.splice(index,1);

    showToast("お気に入りから削除しました");

  }

  localStorage.setItem(
    "ohitorisamapFavorites",
    JSON.stringify(favorites)
  );

  updateFavoriteButton();

}


function updateFavoriteButton(){

  const button =
    document.getElementById("favoriteButton");

  if(!button || !currentDetailId){
    return;
  }

  const isFavorite =
    favorites.includes(currentDetailId);

  if(isFavorite){

    button.textContent =
      "♥ お気に入りから削除";

  }else{

    button.textContent =
      "♡ お気に入りに追加";

  }

}


function renderFavorites(){

  const container =
    document.getElementById("favoritesList");

  if(!container){
    return;
  }

  if(favorites.length === 0){

    container.innerHTML = `
      <div class="favorite-empty">
        <div class="favorite-empty-icon">♡</div>
        <div>まだお気に入りはありません。</div>
        <div style="margin-top:7px;font-size:11px;">
          気になる場所を保存してみよう。
        </div>
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  favorites.forEach(id=>{

    const place =
      places.find(p=>p.id === id);

    if(!place){
      return;
    }

    const card =
      document.createElement("button");

    card.className = "favorite-card";

    card.innerHTML = `
      <div class="favorite-card-name">
        ${place.name}
      </div>

      <div class="favorite-card-meta">
        ${place.category}
       　・　
        <span class="rating">
          ★${place.rating}
        </span>
      </div>
    `;

    card.onclick =
      ()=>openDetail(place.id);

    container.appendChild(card);

  });

}


/* =========================================
   SEARCH
========================================= */

function setSearch(text){

  goPage("search");

  const input =
    document.getElementById("searchInput");

  input.value = text;

  performSearch();

}


function performSearch(){

  const input =
    document.getElementById("searchInput");

  const query =
    input.value.trim().toLowerCase();

  const container =
    document.getElementById("searchResults");

  if(!query){

    container.innerHTML = "";

    return;
  }

  const results =
    places.filter(place=>{

      const text = [

        place.name,
        place.category,
        ...place.tags

      ].join(" ").toLowerCase();

      return text.includes(query);

    });


  if(results.length === 0){

    container.innerHTML = `
      <div class="no-result">
        「${input.value}」に一致する場所が<br>
        見つかりませんでした。
      </div>
    `;

    return;
  }


  container.innerHTML = `
    <div class="section-title"
         style="margin-bottom:12px;">
      検索結果
    </div>
  `;


  results.forEach(place=>{

    const card =
      document.createElement("button");

    card.className =
      "result-card";

    card.innerHTML = `
      <div class="result-thumb"></div>

      <div>
        <div class="result-name">
          ${place.name}
        </div>

        <div class="result-info">
          ${place.category}
         　・　
          <span class="rating">
            ★${place.rating}
          </span>
        </div>
      </div>
    `;

    card.onclick =
      ()=>openDetail(place.id);

    container.appendChild(card);

  });

}


/* Enter */

document
  .getElementById("searchInput")
  ?.addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        performSearch();
        this.blur();
      }

    }
  );


/* =========================================
   CATEGORY
========================================= */

function categoryClick(category){
  setSearch(category);
}


/* =========================================
   CURRENT LOCATION
========================================= */

function getCurrentLocation(){

  if(!navigator.geolocation){

    showToast(
      "この端末では位置情報を利用できません"
    );

    return;
  }

  showToast("現在地を確認しています…");

  navigator.geolocation.getCurrentPosition(

    position=>{

      showToast(
        "現在地を取得しました"
      );

      /*
        本物の地図を導入したときに
        position.coords.latitude
        position.coords.longitude
        を利用する
      */

    },

    ()=>{

      showToast(
        "位置情報の利用を許可してください"
      );

    },

    {
      enableHighAccuracy:true,
      timeout:8000
    }

  );

}


/* =========================================
   TOAST
========================================= */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },2200);

}


/* =========================================
   FAVORITE COUNT
========================================= */

function updateFavoriteCount(){

  const count =
    document.getElementById("favoriteCount");

  if(count){
    count.textContent =
      favorites.length;
  }

}


/* =========================================
   OPENING
========================================= */

window.addEventListener(
  "load",
  ()=>{

    /*
      セッション中に何度も表示しない。
      ブラウザを閉じて再度開くと表示される。
    */

    const opened =
      sessionStorage.getItem(
        "ohitorisamapOpening"
      );

    if(opened){

      document
        .getElementById("opening")
        .style.display = "none";

      return;

    }

    sessionStorage.setItem(
      "ohitorisamapOpening",
      "1"
    );

    setTimeout(()=>{

      document
        .getElementById("opening")
        .classList.add("hide");

    },3900);

  }
);


/* =========================================
   INITIALIZE
========================================= */

renderFavorites();
updateFavoriteCount();

</script>
