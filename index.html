<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ひとりマップ</title>

<style>

/* =========================
   BASE
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f5f5f5;
    color:#111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}


/* =========================
   HEADER
========================= */

header{
    background:#111;
    color:#fff;
    min-height:420px;

    display:flex;
    align-items:center;

    padding:45px 24px;
}

.hero{
    width:100%;
    max-width:700px;
    margin:auto;
}

.hero-small{
    font-size:11px;
    letter-spacing:3px;
    opacity:.55;
    margin-bottom:25px;
}

.hero-title{
    font-size:48px;
    font-weight:600;
    line-height:1.2;
    letter-spacing:3px;
    margin:0;
}

.hero-copy{
    margin-top:22px;
    font-size:15px;
    line-height:2;
    color:#bbb;
}

.hero-search{
    margin-top:35px;

    width:100%;
    max-width:580px;

    height:60px;

    display:flex;
    align-items:center;

    background:#fff;
    color:#111;

    padding:0 20px;

    border-radius:3px;
}

.search-icon{
    width:17px;
    height:17px;

    border:1.5px solid #111;

    border-radius:50%;

    position:relative;

    margin-right:13px;
}

.search-icon:after{
    content:"";

    position:absolute;

    width:7px;
    height:1.5px;

    background:#111;

    right:-5px;
    bottom:-2px;

    transform:rotate(45deg);
}

.hero-search input{
    width:100%;

    border:0;
    outline:0;

    font-size:15px;

    background:transparent;
}


/* =========================
   MAIN
========================= */

main{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:55px 20px 80px;
}


/* =========================
   SECTION
========================= */

.section{
    margin-bottom:65px;
}

.section-head{
    display:flex;

    justify-content:space-between;

    align-items:end;

    margin-bottom:25px;
}

.section-title{
    margin:0;

    font-size:24px;

    font-weight:600;

    letter-spacing:1px;
}

.section-sub{
    margin:6px 0 0;

    color:#999;

    font-size:12px;
}


/* =========================
   CATEGORY
========================= */

.categories{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;
}

.category{
    min-height:110px;

    background:#fff;

    border:1px solid #e4e4e4;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:12px;

    cursor:pointer;

    transition:.2s;
}

.category:hover{
    transform:translateY(-3px);

    border-color:#111;
}

.category-name{
    font-size:12px;

    letter-spacing:1px;
}


/* =========================
   SVG
========================= */

.icon{
    width:30px;
    height:30px;

    fill:none;

    stroke:#111;

    stroke-width:1.5;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =========================
   MAP
========================= */

.map-wrap{
    position:relative;

    width:100%;

    height:430px;

    background:#ddd;

    overflow:hidden;
}

.map{
    position:absolute;

    inset:0;

    background:#e8e8e8;
}


/* roads */

.road{
    position:absolute;

    background:#cfcfcf;
}

.road.one{
    width:130%;
    height:2px;

    left:-15%;
    top:30%;

    transform:rotate(13deg);
}

.road.two{
    width:130%;
    height:2px;

    left:-15%;
    top:65%;

    transform:rotate(-9deg);
}

.road.three{
    width:2px;
    height:130%;

    left:30%;
    top:-15%;

    transform:rotate(12deg);
}

.road.four{
    width:2px;
    height:130%;

    left:72%;
    top:-15%;

    transform:rotate(-15deg);
}


/* map locations */

.map-point{
    position:absolute;

    width:17px;
    height:17px;

    background:#111;

    border:4px solid #fff;

    border-radius:50%;

    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.point1{
    left:25%;
    top:35%;
}

.point2{
    left:61%;
    top:25%;
}

.point3{
    left:70%;
    top:68%;
}

.point4{
    left:38%;
    top:72%;
}


/* current */

.current{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:24px;
    height:24px;

    background:#111;

    border:5px solid #fff;

    border-radius:50%;

    box-shadow:0 0 0 10px rgba(0,0,0,.08);
}


/* map label */

.map-label{
    position:absolute;

    left:20px;
    top:20px;

    background:#fff;

    padding:12px 16px;

    font-size:12px;

    letter-spacing:1px;
}


/* =========================
   PLACE
========================= */

.places{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;
}

.place{
    background:#fff;

    border:1px solid #e2e2e2;

    padding:25px;

    transition:.2s;
}

.place:hover{
    transform:translateY(-3px);

    border-color:#111;
}

.place-number{
    color:#aaa;

    font-size:10px;

    letter-spacing:2px;

    margin-bottom:18px;
}

.place-name{
    font-size:19px;

    font-weight:600;
}

.place-info{
    margin-top:18px;

    display:flex;

    justify-content:space-between;

    align-items:end;
}

.score{
    font-size:28px;

    font-weight:600;
}

.score-label{
    color:#999;

    font-size:10px;

    margin-top:3px;
}

.easy{
    padding:7px 10px;

    background:#111;

    color:#fff;

    font-size:10px;

    letter-spacing:1px;
}

.tags{
    margin-top:18px;

    display:flex;

    flex-wrap:wrap;

    gap:7px;
}

.tag{
    border:1px solid #ddd;

    padding:6px 8px;

    color:#666;

    font-size:10px;
}


/* =========================
   FOOTER
========================= */

footer{
    background:#111;

    color:#fff;

    padding:45px 20px;

    text-align:center;
}

.footer-logo{
    font-size:18px;

    letter-spacing:3px;
}

.footer-copy{
    margin-top:10px;

    color:#777;

    font-size:10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        min-height:480px;

        padding:40px 20px;
    }

    .hero-title{
        font-size:38px;
    }

    .hero-copy{
        font-size:13px;
    }

    main{
        padding:40px 15px 60px;
    }

    .section{
        margin-bottom:50px;
    }

    .section-title{
        font-size:20px;
    }

    .categories{
        grid-template-columns:repeat(4,1fr);

        gap:6px;
    }

    .category{
        min-height:90px;
    }

    .icon{
        width:24px;
        height:24px;
    }

    .category-name{
        font-size:10px;
    }

    .map-wrap{
        height:330px;
    }

    .places{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     HERO
========================= -->

<header>

<div class="hero">

    <div class="hero-small">
        HITORI MAP
    </div>

    <h1 class="hero-title">
        ひとりの時間を、<br>
        もっと自由に。
    </h1>

    <div class="hero-copy">
        一人で行きたい。<br>
        でも、どこに行けばいいかわからない。<br>
        そんなときのための場所探し。
    </div>

    <div class="hero-search">

        <div class="search-icon"></div>

        <input
            type="text"
            placeholder="行きたい場所を探す"
        >

    </div>

</div>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


<!-- CATEGORY -->

<section class="section">

<div class="section-head">

<div>

何をする？
</h2>

目的から探す
</p>

</div>

</div>


<div class="categories">


<!-- 食事 -->

<path d="M12 4v24"/>

<path d="M12 4v7"/>

<path d="M20 4c5 3 5 8 5 12"/>

<!-- カフェ -->

<path d="M9 8c0-2 2-2 2-4"/>
<path d="M14 8c0-2 2-2 2-4"/>

</svg>

</div>



<!-- 映画 -->

<path d="M4 12h24"/>
<path d="M9 7v5"/>
<path d="M15 7v5"/>
<path d="M21 7v5"/>

</svg>

<div class="category-name">
映画
</div>

</div>



<!-- 温泉 -->

<div class="category">

<svg class="icon" viewBox="0 0 32 32">

<path d="M8 25c2-3 2-6 0-9"/>
<path d="M16 25c2-3 2-6 0-9"/>
<path d="M24 25c2-3 2-6 0-9"/>
<path d="M5 28h22"/>

</svg>

<div class="category-name">
温泉
</div>

</div>



<!-- カラオケ -->

<div class="category">

<svg class="icon" viewBox="0 0 32 32">

<rect x="8" y="4" width="16" height="20" rx="8"/>
<path d="M16 24v4"/>
<path d="M11 28h10"/>

</svg>

<div class="category-name">
カラオケ
</div>

</div>



<!-- 遊ぶ -->

<div class="category">

<svg class="icon" viewBox="0 0 32 32">

<circle cx="16" cy="16" r="12"/>
<path d="M13 11l8 5-8 5z"/>

</svg>

<div class="category-name">
遊ぶ
</div>

</div>



<!-- ドライブ -->

<div class="category">

<svg class="icon" viewBox="0 0 32 32">

<path d="M5 20l3-7h16l3 7v6H5z"/>
<path d="M9 13l2-5h10l2 5"/>
<circle cx="10" cy="25" r="2"/>
<circle cx="22" cy="25" r="2"/>

</svg>

<div class="category-name">
ドライブ
</div>

</div>



<!-- お出かけ -->

<div class="category">

<svg class="icon" viewBox="0 0 32 32">

<circle cx="16" cy="16" r="12"/>
<path d="M16 6v20"/>
<path d="M6 16h20"/>
<path d="M20 12l-3 7-7 3 3-7z"/>

</svg>

<div class="category-name">
お出かけ
</div>

</div>


</div>

</section>



<!-- MAP -->

<section class="section">

<div class="section-head">

<div>

<h2 class="section-title">
近くから探す
</h2>

<p class="section-sub">
現在地周辺のひとりスポット
</p>

</div>

</div>


<div class="map-wrap">

<div class="map">

<div class="road one"></div>
<div class="road two"></div>
<div class="road three"></div>
<div class="road four"></div>

<div class="map-point point1"></div>
<div class="map-point point2"></div>
<div class="map-point point3"></div>
<div class="map-point point4"></div>

<div class="current"></div>

</div>


<div class="map-label">
現在地周辺
</div>

</div>

</section>



<!-- POPULAR -->

<section class="section">

<div class="section-head">

<div>

<h2 class="section-title">
一人で行きやすい場所
</h2>

</p>

</div>

</div>


<div class="places">


<div class="place">

<div class="place-number">
01
</div>

<div class="place-name">
○○ラーメン
</div>

<div class="place-info">

<div>

<div class="score">

</div>

<div class="score-label">
一人利用スコア
</div>

</div>

<div class="easy">
一人向き
</div>

</div>

<div class="tags">

<div class="tag">

</div>

<div class="tag">

</div>

</div>

</div>



<div class="place">

<div class="place-number">
02
</div>

<div class="place-name">
○○カフェ
</div>

<div class="place-info">

<div>

<div class="score">
4.7
</div>

<div class="score-label">
一人利用スコア
</div>

</div>

<div class="easy">
一人向き
</div>

</div>

<div class="tags">

<div class="tag">
静か
</div>

<div class="tag">
Wi-Fiあり
</div>

</div>

</div>


</div>

</section>


</main>



<!-- FOOTER -->

<footer>

<div class="footer-logo">
ひとりマップ
</div>

<div class="footer-copy">
一人の時間を、もっと自由に。
</div>

</footer>


</body>
</html>
