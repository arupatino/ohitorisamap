<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ひとりマップ</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f6f6f6;
    color:#111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}


/* =========================
   HEADER
========================= */

header{
    background:#fff;
    padding:30px 22px 26px;
    border-bottom:1px solid #e8e8e8;
}

.logo{
    font-size:24px;
    font-weight:700;
    letter-spacing:2px;
}

.catch{
    margin-top:8px;
    color:#777;
    font-size:13px;
    letter-spacing:1px;
}


/* =========================
   MAIN
========================= */

main{
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:24px 18px 70px;
}


/* =========================
   SEARCH
========================= */

.search{
    width:100%;
    height:54px;
    display:flex;
    align-items:center;

    background:#fff;
    border:1px solid #ddd;
    border-radius:5px;

    padding:0 16px;
}

.search-icon{
    width:17px;
    height:17px;

    border:1.5px solid #111;
    border-radius:50%;

    position:relative;
    margin-right:12px;
    flex-shrink:0;
}

.search-icon:after{
    content:"";

    position:absolute;

    width:7px;
    height:1.5px;

    background:#111;

    right:-5px;
    bottom:-2px;

    transform:rotate(45deg);
}

.search input{
    border:0;
    outline:0;

    width:100%;

    background:transparent;

    font-size:15px;
    color:#111;
}

.search input::placeholder{
    color:#999;
}


/* =========================
   SECTION TITLE
========================= */

.section-title{
    margin-top:38px;
    margin-bottom:18px;
}

.section-title h2{
    margin:0;

    font-size:19px;
    font-weight:600;

    letter-spacing:1px;
}

.section-title p{
    margin:6px 0 0;

    color:#999;

    font-size:12px;
}


/* =========================
   CATEGORY
========================= */

.categories{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:1px;

    background:#ddd;

    border:1px solid #ddd;
}

.category{
    min-height:96px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:10px;

    background:#fff;

    font-size:12px;
    font-weight:500;

    cursor:pointer;

    transition:background .2s;
}

.category:hover{
    background:#f1f1f1;
}

.category:active{
    background:#e8e8e8;
}


/* =========================
   SVG ICON
========================= */

.svg-icon{
    width:28px;
    height:28px;

    fill:none;

    stroke:#111;

    stroke-width:1.5;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================
   MAP
========================= */

.map{
    height:280px;

    position:relative;

    overflow:hidden;

    background:#e9e9e9;

    border:1px solid #ddd;
}


/* map roads */

.map-line{
    position:absolute;

    background:#d2d2d2;
}

.map-line.one{
    width:150%;
    height:1px;

    left:-25%;
    top:43%;

    transform:rotate(-12deg);
}

.map-line.two{
    width:1px;
    height:150%;

    left:56%;
    top:-25%;

    transform:rotate(20deg);
}

.map-line.three{
    width:130%;
    height:1px;

    left:-15%;
    top:70%;

    transform:rotate(7deg);
}

.map-line.four{
    width:1px;
    height:130%;

    left:25%;
    top:-15%;

    transform:rotate(-12deg);
}


/* map pin */

.map-pin{
    position:absolute;

    width:19px;
    height:19px;

    border:2px solid #111;

    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);

    left:50%;
    top:50%;
}

.map-pin:after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    background:#111;

    border-radius:50%;

    left:5px;
    top:5px;
}


/* map label */

.map-text{
    position:absolute;

    left:50%;
    bottom:17px;

    transform:translateX(-50%);

    background:#fff;

    padding:9px 15px;

    font-size:11px;

    letter-spacing:1px;

    white-space:nowrap;

    z-index:3;
}


/* =========================
   LOCATION BUTTON
========================= */

.location{
    width:100%;
    height:50px;

    margin-top:10px;

    border:0;

    background:#111;

    color:#fff;

    font-size:14px;

    letter-spacing:1px;

    cursor:pointer;

    transition:.2s;
}

.location:hover{
    background:#333;
}

.location:active{
    background:#000;
}


/* =========================
   PLACE CARD
========================= */

.place{
    background:#fff;

    border:1px solid #e1e1e1;

    margin-top:12px;

    padding:20px;

    transition:.2s;
}

.place:hover{
    border-color:#bbb;
}


.place-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}


.place-name{
    font-size:17px;

    font-weight:600;
}


.score{
    font-size:21px;

    font-weight:700;

    text-align:right;
}


.score span{
    display:block;

    margin-top:2px;

    color:#999;

    font-size:10px;

    font-weight:400;
}


.status{
    margin-top:15px;

    padding:10px;

    background:#f3f3f3;

    font-size:12px;
}


.details{
    display:flex;

    flex-wrap:wrap;

    gap:15px;

    margin-top:15px;

    color:#666;

    font-size:11px;
}


/* =========================
   FOOTER
========================= */

footer{
    padding:32px 20px;

    background:#fff;

    border-top:1px solid #e8e8e8;

    text-align:center;

    color:#aaa;

    font-size:10px;

    letter-spacing:2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    main{
        padding-left:14px;
        padding-right:14px;
    }

    header{
        padding-left:18px;
        padding-right:18px;
    }

    .logo{
        font-size:22px;
    }

    .categories{
        grid-template-columns:repeat(4,1fr);
    }

    .category{
        min-height:88px;
    }

    .svg-icon{
        width:25px;
        height:25px;
    }

    .map{
        height:250px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        ひとりマップ
    </div>

    <div class="catch">
        一人の時間を、もっと自由に。
    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


    <!-- SEARCH -->

    <div class="search">

        <div class="search-icon"></div>

        <input
            type="text"
            placeholder="行きたい場所を検索"
        >

    </div>



    <!-- CATEGORY -->

    <div class="section-title">

        <h2>
            一人で、何する？
        </h2>

        <p>
            目的から探す
        </p>

    </div>



    <div class="categories">


        <!-- 食事 -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <path d="M8 4v24"/>

                <path d="M12 4v24"/>

                <path d="M8 4v7"/>

                <path d="M12 4v7"/>

                <path d="M20 4v24"/>

                <path d="M20 4c5 3 5 8 5 12"/>

            </svg>

            <span>
                食事
            </span>

        </div>



        <!-- カフェ -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <path d="M6 12h17v9H6z"/>

                <path d="M23 14h3a3 3 0 0 1 0 6h-3"/>

                <path d="M9 8c0-2 2-2 2-4"/>

                <path d="M14 8c0-2 2-2 2-4"/>

            </svg>

            <span>
                カフェ
            </span>

        </div>



        <!-- 映画 -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <rect
                    x="4"
                    y="7"
                    width="24"
                    height="18"
                    rx="2"
                />

                <path d="M4 12h24"/>

                <path d="M9 7v5"/>

                <path d="M15 7v5"/>

                <path d="M21 7v5"/>

            </svg>

            <span>
                映画
            </span>

        </div>



        <!-- 温泉 -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <path d="M8 25c2-3 2-6 0-9"/>

                <path d="M16 25c2-3 2-6 0-9"/>

                <path d="M24 25c2-3 2-6 0-9"/>

                <path d="M5 28h22"/>

            </svg>

            <span>
                温泉
            </span>

        </div>



        <!-- カラオケ -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <rect
                    x="8"
                    y="4"
                    width="16"
                    height="20"
                    rx="8"
                />

                <path d="M16 24v4"/>

                <path d="M11 28h10"/>

            </svg>

            <span>
                カラオケ
            </span>

        </div>



        <!-- 遊ぶ -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <circle
                    cx="16"
                    cy="16"
                    r="12"
                />

                <path d="M13 11l8 5-8 5z"/>

            </svg>

            <span>
                遊ぶ
            </span>

        </div>



        <!-- ドライブ -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <path d="M5 20l3-7h16l3 7v6H5z"/>

                <path d="M9 13l2-5h10l2 5"/>

                <circle
                    cx="10"
                    cy="25"
                    r="2"
                />

                <circle
                    cx="22"
                    cy="25"
                    r="2"
                />

            </svg>

            <span>
                ドライブ
            </span>

        </div>



        <!-- お出かけ -->

        <div class="category">

            <svg
                viewBox="0 0 32 32"
                class="svg-icon"
            >

                <circle
                    cx="16"
                    cy="16"
                    r="12"
                />

                <path d="M16 6v20"/>

                <path d="M6 16h20"/>

                <path d="M20 12l-3 7-7 3 3-7z"/>

            </svg>

            <span>
                お出かけ
            </span>

        </div>


    </div>



    <!-- MAP -->

    <div class="section-title">

        <h2>
            近くから探す
        </h2>

        <p>
            現在地周辺のスポット
        </p>

    </div>



    <div class="map">

        <div class="map-line one"></div>

        <div class="map-line two"></div>

        <div class="map-line three"></div>

        <div class="map-line four"></div>

        <div class="map-pin"></div>

        <div class="map-text">
            地図を表示
        </div>

    </div>



    <button class="location">
        現在地から探す
    </button>



    <!-- POPULAR -->

    <div class="section-title">

        <h2>
            一人で人気の場所
        </h2>

        <p>
            一人で行きやすいスポット
        </p>

    </div>



    <!-- PLACE 1 -->

    <div class="place">

        <div class="place-top">

            <div class="place-name">
                ○○ラーメン
            </div>

            <div class="score">

                4.8

                <span>
                    一人利用スコア
                </span>

            </div>

        </div>


        <div class="status">
            一人でかなり行きやすい
        </div>


        <div class="details">

            <span>
                一人客：多い
            </span>

            <span>
                カウンター：あり
            </span>

        </div>

    </div>



    <!-- PLACE 2 -->

    <div class="place">

        <div class="place-top">

            <div class="place-name">
                ○○カフェ
            </div>

            <div class="score">

                4.7

                <span>
                    一人利用スコア
                </span>

            </div>

        </div>


        <div class="status">
            静かに過ごしやすい
        </div>


        <div class="details">

            <span>
                一人客：多い
            </span>

            <span>
                Wi-Fi：あり
            </span>

        </div>

    </div>


</main>



<!-- FOOTER -->

<footer>

    ひとりマップ

</footer>


</body>
</html>
