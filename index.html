<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ohitorisamap｜おひとりさまっぷ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#03070a;
  --panel:#081117;
  --panel2:#0c171e;
  --line:rgba(109,227,255,.18);
  --blue:#6de3ff;
  --blue2:#21bde5;
  --white:#eefcff;
  --gray:#7f9aa5;
  --danger:#ff5577;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:var(--bg);
  color:var(--white);
}

body{
  position:relative;
}

/* GRID */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(109,227,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(109,227,255,.035) 1px,transparent 1px);
  background-size:35px 35px;
  z-index:100;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at center,
  transparent 30%,
  rgba(0,0,0,.55) 100%);
  z-index:101;
}

/* BOOT */
#boot{
  position:fixed;
  inset:0;
  background:#020507;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition:opacity .8s ease,visibility .8s;
}

.boot-box{
  width:85%;
  max-width:480px;
}

.boot-title{
  color:var(--blue);
  font-size:28px;
  letter-spacing:5px;
  margin-bottom:8px;
}

.boot-sub{
  color:#6f8992;
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:28px;
}

.boot-line{
  height:1px;
  background:linear-gradient(90deg,
  transparent,var(--blue),transparent);
  margin-bottom:18px;
  animation:pulse 1.2s infinite;
}

.boot-text{
  color:#9bdbea;
  font-family:monospace;
  font-size:12px;
  line-height:2;
}

.progress{
  height:2px;
  background:#11252c;
  margin-top:18px;
  overflow:hidden;
}

.progress span{
  display:block;
  width:0;
  height:100%;
  background:var(--blue);
  animation:load 2.4s forwards;
}

@keyframes load{
  to{width:100%}
}

@keyframes pulse{
  50%{opacity:.35}
}

/* APP */
#app{
  width:100%;
  height:100%;
  display:flex;
  opacity:0;
  transition:opacity .8s;
}

#app.active{
  opacity:1;
}

/* SIDE */
.sidebar{
  width:230px;
  height:100%;
  background:rgba(4,10,14,.92);
  border-right:1px solid var(--line);
  position:relative;
  z-index:200;
  padding:26px 18px;
  backdrop-filter:blur(18px);
}

.logo{
  padding:8px 10px 28px;
  border-bottom:1px solid var(--line);
  margin-bottom:25px;
}

.logo-main{
  font-size:22px;
  font-weight:700;
  letter-spacing:2px;
}

.logo-main span{
  color:var(--blue);
}

.logo-sub{
  font-size:9px;
  color:var(--gray);
  letter-spacing:3px;
  margin-top:5px;
}

.status{
  font-size:9px;
  color:#70e9b2;
  letter-spacing:2px;
  margin-bottom:22px;
}

.status::before{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#70e9b2;
  box-shadow:0 0 10px #70e9b2;
  margin-right:8px;
}

.nav-title{
  font-size:8px;
  color:#56717b;
  letter-spacing:2px;
  margin:18px 10px 8px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#8ba4ad;
  text-align:left;
  padding:12px 12px;
  border-radius:5px;
  cursor:pointer;
  transition:.25s;
  font-size:12px;
}

.nav button:hover,
.nav button.active{
  background:rgba(109,227,255,.07);
  border-color:var(--line);
  color:var(--blue);
}

.nav button span{
  margin-right:10px;
}

/* MAIN */
.main{
  flex:1;
  min-width:0;
  height:100%;
  position:relative;
}

/* HEADER */
.header{
  height:70px;
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:linear-gradient(
    180deg,
    rgba(3,7,10,.95),
    rgba(3,7,10,.55),
    transparent
  );
  pointer-events:none;
}

.header>*{
  pointer-events:auto;
}

.page-title{
  font-size:12px;
  letter-spacing:3px;
}

.page-title small{
  display:block;
  color:var(--blue);
  font-size:8px;
  letter-spacing:2px;
  margin-top:5px;
}

.user{
  width:35px;
  height:35px;
  border:1px solid var(--line);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
}

/* MAP */
#map{
  width:100%;
  height:100%;
  background:#071014;
}

.leaflet-container{
  background:#071014;
}

.leaflet-control-zoom{
  display:none;
}

.leaflet-control-attribution{
  background:rgba(0,0,0,.55)!important;
  color:#56717b!important;
  font-size:8px;
}

/* SEARCH */
.search-area{
  position:absolute;
  top:80px;
  left:25px;
  right:25px;
  z-index:500;
  display:flex;
  gap:8px;
}

.search{
  flex:1;
  max-width:520px;
  height:48px;
  background:rgba(5,13,18,.88);
  border:1px solid var(--line);
  border-radius:5px;
  display:flex;
  align-items:center;
  padding:0 15px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.search-icon{
  color:var(--blue);
  margin-right:10px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:13px;
}

.search input::placeholder{
  color:#607b85;
}

.locate{
  width:48px;
  height:48px;
  border:1px solid var(--line);
  background:rgba(5,13,18,.88);
  color:var(--blue);
  border-radius:5px;
  cursor:pointer;
}

/* HOME PANEL */
.home-panel{
  position:absolute;
  z-index:450;
  left:25px;
  bottom:25px;
  width:420px;
  max-width:calc(100% - 50px);
  background:rgba(4,11,15,.91);
  border:1px solid var(--line);
  border-radius:7px;
  padding:20px;
  backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.panel-title{
  font-size:14px;
  letter-spacing:1px;
}

.panel-code{
  font-size:8px;
  color:var(--blue);
  letter-spacing:2px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.category{
  height:65px;
  background:rgba(109,227,255,.035);
  border:1px solid rgba(109,227,255,.12);
  border-radius:5px;
  color:#a9c2c9;
  cursor:pointer;
  transition:.25s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:9px;
}

.category:hover{
  border-color:var(--blue);
  color:var(--blue);
  background:rgba(109,227,255,.08);
  transform:translateY(-2px);
}

.category .icon{
  font-size:18px;
  filter:grayscale(1);
}

/* PLACE CARD */
.place-card{
  position:absolute;
  top:145px;
  right:25px;
  width:280px;
  z-index:450;
  background:rgba(4,11,15,.91);
  border:1px solid var(--line);
  border-radius:6px;
  padding:17px;
  backdrop-filter:blur(18px);
  display:none;
}

.place-card.show{
  display:block;
  animation:slideIn .3s ease;
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateX(15px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.place-tag{
  font-size:8px;
  color:var(--blue);
  letter-spacing:2px;
}

.place-name{
  font-size:17px;
  margin:7px 0;
}

.place-info{
  color:#78939d;
  font-size:10px;
  line-height:1.8;
}

.rating{
  margin-top:10px;
  color:#d7f9ff;
  font-size:11px;
}

.close-card{
  position:absolute;
  right:12px;
  top:10px;
  border:0;
  background:transparent;
  color:#607b85;
  cursor:pointer;
}

/* MOBILE NAV */
.mobile-nav{
  display:none;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
  z-index:9000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#071117;
  border:1px solid var(--line);
  border-radius:8px;
  padding:25px;
  box-shadow:0 30px 100px #000;
}

.modal-title{
  font-size:18px;
  margin-bottom:5px;
}

.modal-sub{
  color:#607b85;
  font-size:10px;
  margin-bottom:20px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  background:#03090d;
  border:1px solid var(--line);
  color:white;
  padding:13px;
  border-radius:4px;
  outline:none;
}

.form textarea{
  min-height:100px;
  resize:vertical;
}

.form button{
  padding:13px;
  border:1px solid var(--blue);
  color:var(--blue);
  background:rgba(109,227,255,.05);
  border-radius:4px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .main{
    width:100%;
  }

  .header{
    height:62px;
    padding:0 16px;
  }

  .search-area{
    top:68px;
    left:15px;
    right:15px;
  }

  .search{
    height:45px;
  }

  .locate{
    width:45px;
    height:45px;
  }

  .home-panel{
    left:12px;
    right:12px;
    bottom:70px;
    width:auto;
    max-width:none;
    padding:15px;
  }

  .panel-title{
    font-size:13px;
  }

  .categories{
    grid-template-columns:repeat(4,1fr);
  }

  .category{
    height:60px;
    font-size:8px;
  }

  .category .icon{
    font-size:16px;
  }

  .place-card{
    top:auto;
    bottom:245px;
    left:12px;
    right:12px;
    width:auto;
  }

  .mobile-nav{
    display:flex;
    position:absolute;
    z-index:600;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:rgba(3,8,11,.96);
    border-top:1px solid var(--line);
    justify-content:space-around;
    align-items:center;
    backdrop-filter:blur(15px);
  }

  .mobile-nav button{
    background:none;
    border:0;
    color:#66818a;
    font-size:9px;
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:center;
  }

  .mobile-nav button.active{
    color:var(--blue);
  }

  .mobile-nav .mi{
    font-size:18px;
  }
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
  <div class="boot-box">
    <div class="boot-title">ohitorisamap</div>
    <div class="boot-sub">PERSONAL SOLO DISCOVERY SYSTEM</div>
    <div class="boot-line"></div>
    <div class="boot-text" id="bootText">
      INITIALIZING SYSTEM...
    </div>
    <div class="progress">
      <span></span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDE -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-main">
        ohitori<span>samap</span>
      </div>
      <div class="logo-sub">
        おひとりさまっぷ
      </div>
    </div>

    <div class="status">
      SYSTEM ONLINE
    </div>

    <div class="nav-title">MAIN SYSTEM</div>

    <div class="nav">
      <button class="active" onclick="goHome()">
        <span>⌂</span>ホーム
      </button>

      <button onclick="showSearch()">
        <span>⌕</span>場所を探す
      </button>

      <button onclick="showHistory()">
        <span>◷</span>行った場所
      </button>

      <button onclick="showFavorites()">
        <span>◇</span>お気に入り
      </button>
    </div>

    <div class="nav-title">PERSONAL</div>

    <div class="nav">
      <button onclick="openModal()">
        <span>＋</span>場所を記録
      </button>

      <button onclick="alert('プロフィール機能は準備中です')">
        <span>○</span>プロフィール
      </button>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="header">

      <div class="page-title">
        おひとりさまっぷ
        <small>SOLO DISCOVERY NETWORK</small>
      </div>

      <div class="user">○</div>

    </header>

    <!-- SEARCH -->
    <div class="search-area">

      <div class="search">
        <span class="search-icon">⌕</span>
        <input
          id="searchInput"
          type="text"
          placeholder="ひとりで行ける場所を検索..."
          onkeydown="searchPlace(event)"
        >
      </div>

      <button class="locate" onclick="locateUser()">
        ◎
      </button>

    </div>

    <!-- MAP -->
    <div id="map"></div>

    <!-- HOME PANEL -->
    <section class="home-panel">

      <div class="panel-head">
        <div class="panel-title">
          今日は、ひとりでどこ行く？
        </div>

        <div class="panel-code">
          SELECT MODE
        </div>
      </div>

      <div class="categories">

        <button class="category" onclick="categorySearch('ひとり飯')">
          <div class="icon">🍜</div>
          <div>ひとり飯</div>
        </button>

        <button class="category" onclick="categorySearch('カフェ')">
          <div class="icon">☕</div>
          <div>カフェ</div>
        </button>

        <button class="category" onclick="categorySearch('映画')">
          <div class="icon">🎬</div>
          <div>映画</div>
        </button>

        <button class="category" onclick="categorySearch('温泉')">
          <div class="icon">♨</div>
          <div>温泉</div>
        </button>

        <button class="category" onclick="categorySearch('買い物')">
          <div class="icon">◇</div>
          <div>買い物</div>
        </button>

        <button class="category" onclick="categorySearch('遊び')">
          <div class="icon">✦</div>
          <div>遊ぶ</div>
        </button>

        <button class="category" onclick="categorySearch('夜')">
          <div class="icon">☾</div>
          <div>夜スポット</div>
        </button>

        <button class="category" onclick="categorySearch('穴場')">
          <div class="icon">⌖</div>
          <div>穴場</div>
        </button>

      </div>

    </section>

    <!-- PLACE CARD -->
    <div class="place-card" id="placeCard">

      <button class="close-card" onclick="closeCard()">×</button>

      <div class="place-tag">LOCATION SELECTED</div>

      <div class="place-name" id="placeName">
        場所の名前
      </div>

      <div class="place-info" id="placeInfo">
        詳細情報
      </div>

      <div class="rating">
        ★★★★★ <span id="ratingText">4.5</span>
      </div>

    </div>

    <!-- MOBILE NAV -->
    <nav class="mobile-nav">

      <button class="active" onclick="goHome()">
        <span class="mi">⌂</span>
        ホーム
      </button>

      <button onclick="showSearch()">
        <span class="mi">⌕</span>
        探す
      </button>

      <button onclick="showHistory()">
        <span class="mi">◷</span>
        記録
      </button>

      <button onclick="showFavorites()">
        <span class="mi">◇</span>
        お気に入り
      </button>

    </nav>

  </main>
</div>

<!-- MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-title">
      PLACE RECORD
    </div>

    <div class="modal-sub">
      自分だけの「おひとりさま記録」を追加
    </div>

    <div class="form">

      <input id="recordName"
             placeholder="場所の名前">

      <select id="recordCategory">
        <option>ひとり飯</option>
        <option>カフェ</option>
        <option>映画</option>
        <option>温泉</option>
        <option>買い物</option>
        <option>遊び</option>
        <option>その他</option>
      </select>

      <textarea id="recordMemo"
                placeholder="感想・メモ"></textarea>

      <button onclick="saveRecord()">
        RECORD SAVE
      </button>

      <button
        style="border-color:#34515a;color:#78939d"
        onclick="closeModal()">
        CANCEL
      </button>

    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   BOOT
========================= */

const bootMessages = [
  "INITIALIZING SYSTEM...",
  "CONNECTING TO SOLO NETWORK...",
  "LOADING LOCATION DATABASE...",
  "CALIBRATING MAP SYSTEM...",
  "SYSTEM ONLINE."
];

let bootIndex = 0;

const bootText = document.getElementById("bootText");

const bootTimer = setInterval(() => {

  bootIndex++;

  if(bootIndex < bootMessages.length){
    bootText.textContent = bootMessages[bootIndex];
  }

},450);

setTimeout(() => {

  clearInterval(bootTimer);

  document.getElementById("boot").style.opacity = "0";
  document.getElementById("boot").style.visibility = "hidden";

  document.getElementById("app").classList.add("active");

},2600);


/* =========================
   MAP
========================= */

const map = L.map("map", {
  zoomControl:false
}).setView([33.5597,133.5311],13);

/* OpenStreetMap */
L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);


/* =========================
   MARKERS
========================= */

const locations = [

  {
    name:"Solo Cafe",
    lat:33.561,
    lng:133.532,
    category:"カフェ",
    info:"ひとりでゆっくり過ごせるカフェ",
    rating:"4.6"
  },

  {
    name:"SOLO RAMEN",
    lat:33.555,
    lng:133.535,
    category:"ひとり飯",
    info:"カウンター席中心のラーメン店",
    rating:"4.4"
  },

  {
    name:"Cinema",
    lat:33.565,
    lng:133.528,
    category:"映画",
    info:"一人映画にもおすすめ",
    rating:"4.5"
  },

  {
    name:"Hidden Spot",
    lat:33.552,
    lng:133.525,
    category:"穴場",
    info:"静かに過ごせる隠れスポット",
    rating:"4.7"
  }

];

locations.forEach(place => {

  const marker = L.circleMarker(
    [place.lat,place.lng],
    {
      radius:7,
      color:"#6de3ff",
      fillColor:"#6de3ff",
      fillOpacity:.7,
      weight:1
    }
  ).addTo(map);

  marker.bindTooltip(
    place.name,
    {
      direction:"top",
      offset:[0,-7]
    }
  );

  marker.on("click",() => {

    document.getElementById("placeName")
      .textContent = place.name;

    document.getElementById("placeInfo")
      .textContent =
      `${place.category}｜${place.info}`;

    document.getElementById("ratingText")
      .textContent = place.rating;

    document.getElementById("placeCard")
      .classList.add("show");

  });

});


/* =========================
   FUNCTIONS
========================= */

function closeCard(){

  document
    .getElementById("placeCard")
    .classList.remove("show");

}


/* CATEGORY */

function categorySearch(category){

  document.getElementById("searchInput")
    .value = category;

  const results =
    locations.filter(x => x.category === category);

  if(results.length){

    map.setView(
      [results[0].lat,results[0].lng],
      15
    );

  }else{

    alert(
      `${category}の登録スポットを検索しています。`
    );

  }

}


/* SEARCH */

function searchPlace(event){

  if(event.key !== "Enter") return;

  const keyword =
    event.target.value.trim();

  if(!keyword) return;

  const result =
    locations.find(x =>
      x.name.includes(keyword) ||
      x.category.includes(keyword)
    );

  if(result){

    map.setView(
      [result.lat,result.lng],
      16
    );

  }else{

    alert(
      `「${keyword}」を検索しました。\n\n実際のサービスでは、ここから周辺の店舗・スポットを取得します。`
    );

  }

}


/* LOCATION */

function locateUser(){

  if(!navigator.geolocation){

    alert("位置情報に対応していません。");
    return;

  }

  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      map.setView(
        [lat,lng],
        15
      );

      L.circleMarker(
        [lat,lng],
        {
          radius:8,
          color:"#70e9b2",
          fillColor:"#70e9b2",
          fillOpacity:.8,
          weight:2
        }
      )
      .addTo(map)
      .bindTooltip("現在地");

    },

    () => {

      alert(
        "現在地を取得できませんでした。"
      );

    }

  );

}

/* MODAL */

function openModal(){

  document
    .getElementById("modal")
    .classList.add("show");

}

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}

function saveRecord(){

  const name =
    document.getElementById("recordName").value;

  const category =
    document.getElementById("recordCategory").value;

  const memo =
    document.getElementById("recordMemo").value;

  if(!name){

    alert("場所の名前を入力してください。");
    return;

  }

  const records =
    JSON.parse(
      localStorage.getItem("ohitorisamap_records")
      || "[]"
    );

  records.push({

    name:name,
    category:category,
    memo:memo,
    date:new Date().toLocaleDateString("ja-JP")

  });

  localStorage.setItem(
    "ohitorisamap_records",
    JSON.stringify(records)
  );

  alert("PLACE RECORD SAVED.");

  document.getElementById("recordName").value="";
  document.getElementById("recordMemo").value="";

  closeModal();

}
