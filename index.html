<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ohitorisamap｜おひとりさまっぷ</title>

<!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* ==================================================
   BASE
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#03070a;

    color:#e9fbff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    overflow-x:hidden;
}


/* ==================================================
   GRID
================================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:9999;

    background:

        linear-gradient(
            rgba(80,220,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(80,220,255,.018) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}


/* ==================================================
   BOOT
================================================== */

.boot{

    position:fixed;

    inset:0;

    z-index:10000;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#020506;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.boot.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.boot-content{

    text-align:center;
}

.boot-core{

    width:120px;

    height:120px;

    position:relative;

    border:
        1px solid
        rgba(90,225,255,.5);

    border-radius:50%;

    box-shadow:
        0 0 30px
        rgba(70,220,255,.1);

    animation:pulse 2s infinite;
}

.boot-core::before{

    content:"";

    position:absolute;

    inset:12px;

    border:
        1px solid
        rgba(90,225,255,.25);

    border-radius:50%;
}

.boot-core::after{

    content:"";

    position:absolute;

    left:50%;

    top:50%;

    width:24px;

    height:24px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#6de3ff;

    box-shadow:
        0 0 12px #6de3ff,
        0 0 35px
        rgba(70,220,255,.7);
}

.boot-ring{

    position:absolute;

    inset:-10px;

    border-radius:50%;

    border-top:
        1px solid #6de3ff;

    border-right:
        1px solid transparent;

    border-bottom:
        1px solid
        rgba(100,225,255,.2);

    border-left:
        1px solid transparent;

    animation:
        rotate 1.5s linear infinite;
}

.boot-status{

    margin-top:35px;

    font-size:10px;

    letter-spacing:4px;

    color:#6de3ff;
}

.boot-jp{

    display:block;

    margin-top:8px;

    font-size:9px;

    letter-spacing:1px;

    color:#58727c;
}


/* ACCESS */

.access{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:#020506;

    opacity:0;

    pointer-events:none;
}

.access.show{

    animation:
        access .8s forwards;
}

.access-title{

    font-size:11px;

    letter-spacing:5px;

    color:#6de3ff;

    text-shadow:
        0 0 15px
        rgba(70,220,255,.8);
}

.access-name{

    margin-top:18px;

    font-size:32px;

    letter-spacing:6px;
}

.access-jp{

    margin-top:10px;

    font-size:10px;

    letter-spacing:4px;

    color:#78949d;
}


/* ==================================================
   ANIMATION
================================================== */

@keyframes rotate{

    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{

    50%{

        box-shadow:
            0 0 50px
            rgba(70,220,255,.2);
    }
}

@keyframes access{

    to{
        opacity:1;
    }
}

@keyframes pageIn{

    from{

        opacity:0;

        transform:
            translateY(8px);
    }

    to{

        opacity:1;

        transform:none;
    }
}

@keyframes scan{

    0%{
        opacity:.2;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.05);
    }

    100%{
        opacity:.2;
        transform:scale(.8);
    }
}


/* ==================================================
   APP
================================================== */

.app{

    min-height:100vh;

    opacity:0;

    transition:
        opacity 1s ease;
}

.app.show{
    opacity:1;
}


/* ==================================================
   PAGE
================================================== */

.page{

    display:none;

    min-height:100vh;

    padding-bottom:100px;

    animation:
        pageIn .4s ease;
}

.page.active{
    display:block;
}


/* ==================================================
   TOPBAR
================================================== */

.topbar{

    position:sticky;

    top:0;

    z-index:100;

    height:65px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    background:
        rgba(3,7,10,.9);

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid
        rgba(80,220,255,.12);
}

.logo{

    font-size:14px;

    letter-spacing:3px;

    color:#eaffff;
}

.logo span{
    color:#6de3ff;
}

.top-status{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:8px;

    letter-spacing:2px;

    color:#5d8793;
}

.status-dot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#6de3ff;

    box-shadow:
        0 0 8px #6de3ff;
}


/* ==================================================
   CONTAINER
================================================== */

.container{

    width:100%;

    max-width:1050px;

    margin:auto;

    padding:60px 20px;
}

.page-code{

    font-size:8px;

    letter-spacing:3px;

    color:#3c8295;
}

.page-title{

    margin:8px 0 0;

    font-size:30px;

    font-weight:500;

    letter-spacing:3px;
}

.page-sub{

    margin:10px 0 0;

    font-size:10px;

    color:#58717a;
}


/* ==================================================
   HOME
================================================== */

.home-hero{

    min-height:
        calc(100vh - 65px);

    display:flex;

    align-items:center;

    position:relative;

    overflow:hidden;
}

.home-hero::before{

    content:"";

    position:absolute;

    width:600px;

    height:600px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(50,210,255,.08),
            transparent 65%
        );
}

.hero-content{

    position:relative;

    z-index:2;
}

.system{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:25px;

    font-size:9px;

    letter-spacing:3px;

    color:#6de3ff;
}

.hero-title{

    margin:0;

    font-size:
        clamp(42px,9vw,90px);

    font-weight:500;

    line-height:1;

    letter-spacing:6px;

    color:#eaffff;

    text-shadow:
        0 0 10px
        rgba(100,230,255,.6),
        0 0 30px
        rgba(0,180,255,.2);
}

.hero-jp{

    margin-top:18px;

    font-size:14px;

    letter-spacing:5px;

    color:#75929c;
}

.hero-copy{

    margin-top:22px;

    font-size:12px;

    line-height:2;

    color:#5e7882;
}


/* ==================================================
   SEARCH
================================================== */

.search-box{

    margin-top:40px;

    max-width:720px;

    height:62px;

    display:flex;

    align-items:center;

    border:
        1px solid
        rgba(80,220,255,.4);

    background:
        rgba(20,100,120,.05);

    transition:.25s;
}

.search-box:focus-within{

    border-color:#6de3ff;

    box-shadow:
        0 0 25px
        rgba(50,210,255,.12);
}

.search-icon{

    width:17px;

    height:17px;

    margin:0 18px;

    border:
        1px solid
        #6de3ff;

    border-radius:50%;

    position:relative;
}

.search-icon::after{

    content:"";

    position:absolute;

    width:7px;

    height:1px;

    right:-5px;

    bottom:-2px;

    background:#6de3ff;

    transform:
        rotate(45deg);
}

.search-box input{

    flex:1;

    height:100%;

    border:0;

    outline:0;

    background:transparent;

    color:#eaffff;

    font-size:13px;
}

.search-box input::placeholder{
    color:#42606b;
}


/* ==================================================
   MODULE
================================================== */

.module{
    margin-top:70px;
}

.module-head{
    margin-bottom:22px;
}

.module-code{

    font-size:8px;

    letter-spacing:3px;

    color:#397487;
}

.module-title{

    margin:6px 0 0;

    font-size:21px;

    font-weight:500;

    letter-spacing:2px;
}

.module-sub{

    margin:7px 0 0;

    font-size:9px;

    color:#58717a;
}


/* ==================================================
   CATEGORY
================================================== */

.categories{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;
}

.category{

    min-height:125px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:15px;

    position:relative;

    background:
        linear-gradient(
            140deg,
            rgba(30,100,120,.08),
            rgba(0,0,0,.25)
        );

    border:
        1px solid
        rgba(70,180,210,.2);

    cursor:pointer;

    transition:.25s;
}

.category:hover{

    transform:
        translateY(-4px);

    border-color:#6de3ff;

    box-shadow:
        0 0 20px
        rgba(70,220,255,.08);
}

.category-svg{

    width:32px;

    height:32px;

    fill:none;

    stroke:#6de3ff;

    stroke-width:1.5;

    stroke-linecap:round;

    stroke-linejoin:round;

    filter:
        drop-shadow(
            0 0 6px
            rgba(70,220,255,.45)
        );

    transition:.25s;
}

.category:hover .category-svg{

    transform:
        scale(1.12);

    filter:
        drop-shadow(
            0 0 10px
            rgba(70,220,255,.8)
        );
}

.category-name{

    font-size:10px;

    letter-spacing:3px;
}


/* ==================================================
   RADAR
================================================== */

.radar-wrap{

    height:420px;

    position:relative;

    overflow:hidden;

    border:
        1px solid
        rgba(70,180,210,.25);

    background:#050b0f;
}

.radar{

    position:absolute;

    width:300px;

    height:300px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(70,220,255,.3);

    border-radius:50%;
}

.radar::before,
.radar::after{

    content:"";

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(70,220,255,.15);

    border-radius:50%;
}

.radar::before{

    width:200px;
    height:200px;
}

.radar::after{

    width:100px;
    height:100px;
}

.radar-line-h,
.radar-line-v{

    position:absolute;

    background:
        rgba(70,220,255,.12);
}

.radar-line-h{

    left:0;

    top:50%;

    width:100%;

    height:1px;
}

.radar-line-v{

    top:0;

    left:50%;

    width:1px;

    height:100%;
}

.sweep{

    position:absolute;

    left:50%;

    top:50%;

    width:50%;

    height:50%;

    transform-origin:
        0 0;

    background:
        linear-gradient(
            90deg,
            rgba(70,220,255,.25),
            transparent
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 3%
        );

    animation:
        rotate 4s linear infinite;
}

.radar-point{

    position:absolute;

    width:11px;

    height:11px;

    border-radius:50%;

    background:#6de3ff;

    border:2px solid white;

    box-shadow:
        0 0 10px #6de3ff,
        0 0 20px
        rgba(70,220,255,.6);
}

.rp1{
    left:30%;
    top:32%;
}

.rp2{
    left:68%;
    top:28%;
}

.rp3{
    left:72%;
    top:70%;
}

.rp4{
    left:27%;
    top:67%;
}

.radar-current{

    position:absolute;

    left:50%;

    top:50%;

    width:20px;

    height:20px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid white;

    border-radius:50%;

    box-shadow:
        0 0 10px #6de3ff,
        0 0 30px
        rgba(70,220,255,.7);
}

.radar-current::after{

    content:"";

    position:absolute;

    inset:6px;

    border-radius:50%;

    background:#6de3ff;
}

.radar-info{

    position:absolute;

    top:18px;

    left:18px;

    font-size:8px;

    line-height:2;

    letter-spacing:2px;

    color:#6de3ff;
}

.radar-info-right{

    position:absolute;

    right:18px;

    bottom:18px;

    font-size:8px;

    line-height:2;

    text-align:right;

    color:#527783;
}


/* ==================================================
   MAP
================================================== */

.real-map{

    width:100%;

    height:420px;

    margin-top:35px;

    border:
        1px solid
        rgba(70,180,210,.25);

    position:relative;

    overflow:hidden;
}

#mapCanvas{

    width:100%;

    height:100%;
}

.map-overlay{

    position:absolute;

    top:15px;

    left:15px;

    z-index:500;

    padding:12px 15px;

    background:
        rgba(3,10,14,.9);

    border:
        1px solid
        rgba(80,220,255,.3);

    color:#6de3ff;

    font-size:8px;

    line-height:2;

    letter-spacing:2px;
}

.location-button{

    position:absolute;

    right:15px;

    bottom:15px;

    z-index:500;

    padding:12px 15px;

    background:
        rgba(3,10,14,.95);

    border:
        1px solid
        rgba(80,220,255,.4);

    color:#6de3ff;

    cursor:pointer;

    font-size:9px;

    letter-spacing:2px;
}

.leaflet-container{

    background:#061015;
}

.leaflet-control-attribution{

    font-size:7px !important;
}


/* ==================================================
   PLACES
================================================== */

.places{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.place{

    padding:25px;

    border:
        1px solid
        rgba(70,180,210,.2);

    background:
        linear-gradient(
            140deg,
            rgba(20,80,100,.08),
            rgba(0,0,0,.25)
        );

    transition:.25s;

    cursor:pointer;
}

.place:hover{

    border-color:#6de3ff;

    transform:
        translateY(-4px);
}

.place-id{

    font-size:8px;

    letter-spacing:3px;

    color:#397487;
}

.place-name{

    margin-top:14px;

    font-size:18px;

    letter-spacing:2px;
}

.place-score{

    margin-top:22px;

    display:flex;

    justify-content:space-between;

    align-items:end;
}

.score{

    font-size:32px;

    color:#6de3ff;

    text-shadow:
        0 0 10px
        rgba(70,220,255,.4);
}

.score-label{

    font-size:8px;

    color:#527783;

    letter-spacing:2px;
}

.easy{

    padding:7px 10px;

    border:
        1px solid
        rgba(70,220,255,.4);

    color:#6de3ff;

    font-size:8px;

    letter-spacing:2px;
}

.tags{

    margin-top:18px;

    display:flex;

    flex-wrap:wrap;

    gap:6px;
}

.tag{

    padding:5px 8px;

    border:
        1px solid
        rgba(100,160,175,.2);

    color:#66838c;

    font-size:8px;
}


/* ==================================================
   SEARCH PAGE
================================================== */

.search-large{

    margin-top:35px;

    width:100%;

    height:60px;

    display:flex;

    align-items:center;

    border:
        1px solid
        rgba(80,220,255,.35);

    background:
        rgba(20,100,120,.05);
}

.search-large input{

    flex:1;

    height:100%;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    padding:0 18px;

    font-size:13px;
}

.search-results{
    margin-top:35px;
}

.result-count{

    font-size:9px;

    letter-spacing:2px;

    color:#4f7e8b;
}

.result{

    margin-top:10px;

    padding:20px;

    border:
        1px solid
        rgba(70,180,210,.18);

    display:flex;

    justify-content:space-between;

    align-items:center;

    cursor:pointer;

    transition:.2s;
}

.result:hover{
    border-color:#6de3ff;
}

.result-name{

    font-size:14px;

    letter-spacing:1px;
}

.result-info{

    margin-top:6px;

    font-size:8px;

    color:#58717a;
}

.result-score{

    color:#6de3ff;

    font-size:20px;
}


/* ==================================================
   DETAIL
================================================== */

.detail-hero{

    padding:45px 0;

    border-bottom:
        1px solid
        rgba(70,180,210,.15);
}

.detail-name{

    margin:10px 0 0;

    font-size:34px;

    letter-spacing:3px;
}

.detail-location{

    margin-top:10px;

    color:#58717a;

    font-size:10px;
}

.detail-score-box{

    margin-top:30px;

    display:flex;

    gap:30px;

    align-items:end;
}

.big-score{

    font-size:55px;

    color:#6de3ff;
}

.detail-score-label{

    font-size:9px;

    color:#58717a;
}

.detail-actions{

    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.action{

    padding:15px;

    text-align:center;

    border:
        1px solid
        rgba(70,180,210,.25);

    color:#6de3ff;

    font-size:9px;

    letter-spacing:2px;

    cursor:pointer;
}

.action:hover{

    border-color:#6de3ff;

    background:
        rgba(70,220,255,.05);
}

.action.active{

    background:
        rgba(70,220,255,.12);

    border-color:#6de3ff;
}

.detail-section{

    margin-top:50px;
}

.detail-section-title{

    font-size:15px;

    letter-spacing:2px;
}

.rating-row{

    margin-top:18px;

    padding:15px 0;

    border-bottom:
        1px solid
        rgba(70,180,210,.1);

    display:flex;

    justify-content:space-between;
}

.rating-name{

    font-size:10px;

    color:#7c969e;
}

.rating{

    color:#6de3ff;

    letter-spacing:3px;
}


/* ==================================================
   RATING PANEL
================================================== */

.rating-panel{

    margin-top:30px;

    padding:25px;

    border:
        1px solid
        rgba(70,180,210,.2);

    background:
        rgba(20,100,120,.04);
}

.rating-stars{

    display:flex;

    gap:10px;

    margin-top:18px;
}

.star{

    font-size:25px;

    color:#29424b;

    cursor:pointer;

    transition:.2s;
}

.star.selected,
.star:hover{

    color:#6de3ff;

    text-shadow:
        0 0 10px
        rgba(70,220,255,.7);
}

.save-button{

    margin-top:20px;

    padding:13px 20px;

    border:
        1px solid
        rgba(70,220,255,.5);

    background:
        rgba(70,220,255,.05);

    color:#6de3ff;

    cursor:pointer;

    letter-spacing:2px;
}


/* ==================================================
   MY
================================================== */

.profile{

    margin-top:35px;

    padding:25px;

    border:
        1px solid
        rgba(70,180,210,.2);

    background:
        rgba(20,100,120,.04);
}

.profile-label{

    font-size:8px;

    letter-spacing:3px;

    color:#397487;
}

.profile-name{

    margin-top:10px;

    font-size:22px;

    letter-spacing:2px;
}

.profile-edit{

    margin-top:15px;

    display:inline-block;

    padding:8px 12px;

    border:
        1px solid
        rgba(70,180,210,.3);

    color:#6de3ff;

    font-size:8px;

    cursor:pointer;
}

.my-grid{

    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.my-card{

    padding:22px;

    border:
        1px solid
        rgba(70,180,210,.18);

    cursor:pointer;

    transition:.2s;
}

.my-card:hover{

    border-color:#6de3ff;
}

.my-card-number{

    font-size:25px;

    color:#6de3ff;
}

.my-card-label{

    margin-top:8px;

    font-size:9px;

    color:#64808a;

    letter-spacing:2px;
}

.history{

    margin-top:25px;
}

.history-item{

    padding:17px 0;

    border-bottom:
        1px solid
        rgba(70,180,210,.1);

    display:flex;

    justify-content:space-between;

    cursor:pointer;
}

.history-name{

    font-size:11px;
}

.history-date{

    font-size:8px;

    color:#527783;
}


/* ==================================================

/* ==================================================
   TOAST
================================================== */

.toast{

    position:fixed;

    left:50%;

    bottom:95px;

    transform:
        translate(-50%,20px);

    z-index:9000;

    padding:14px 20px;

    background:
        rgba(3,10,14,.96);

    border:
        1px solid
        rgba(70,220,255,.5);

    color:#6de3ff;

    font-size:9px;

    letter-spacing:2px;

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* ==================================================
   NAV
================================================== */

.navigation{

    position:fixed;

    z-index:500;

    left:50%;

    bottom:15px;

    transform:
        translateX(-50%);

    width:
        min(94%,500px);

    height:65px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    border:
        1px solid
        rgba(80,220,255,.3);

    background:
        rgba(3,8,11,.9);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.5);
}

.nav-button{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#52727d;

    font-size:8px;

    letter-spacing:1px;

    cursor:pointer;

    transition:.2s;
}

.nav-icon{

    font-size:16px;
}

.nav-button.active{

    color:#6de3ff;

    text-shadow:
        0 0 10px
        rgba(70,220,255,.5);
}


/* ==================================================
   MODAL
================================================== */

.modal{

    position:fixed;

    inset:0;

    z-index:8000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{

    width:100%;

    max-width:500px;

    padding:30px;

    background:#050b0f;

    border:
        1px solid
        rgba(70,220,255,.35);

    box-shadow:
        0 0 40px
        rgba(0,0,0,.7);
}

.modal-title{

    color:#6de3ff;

    letter-spacing:3px;

    font-size:12px;
}

.modal-close{

    float:right;

    color:#6de3ff;

    cursor:pointer;

    font-size:18px;
}

    }

    }

    }

}
