<script>

/* ==================================================
   起動シーケンス
================================================== */

const bootStatus = document.getElementById("bootStatus");
const boot = document.getElementById("boot");
const access = document.getElementById("access");
const app = document.getElementById("app");

const sequence = [
    [0, "SYSTEM LOCKED", "システムを確認しています"],
    [800, "AUTHENTICATING", "接続を確認しています"],
    [1600, "ACCESS CHECK", "アクセスを確認しています"],
    [2200, "ACCESS GRANTED", "アクセスを許可しました"]
];

sequence.forEach(item => {
    setTimeout(() => {
        bootStatus.innerHTML =
            item[1] +
            '<span class="boot-jp">' +
            item[2] +
            '</span>';
    }, item[0]);
});

setTimeout(() => {
    access.classList.add("show");
}, 2500);

setTimeout(() => {
    app.classList.add("show");
}, 3300);

setTimeout(() => {
    boot.classList.add("hide");
}, 3900);


/* ==================================================
   ページ移動
================================================== */

function go(pageName){

    const pages = document.querySelectorAll(".page");

    pages.forEach(page => {
        page.classList.remove("active");
    });

    const target = document.getElementById(pageName);

    if(target){
        target.classList.add("active");
    }

    const buttons = document.querySelectorAll(".nav-button");

    buttons.forEach(button => {

        button.classList.remove("active");

        if(button.dataset.page === pageName){
            button.classList.add("active");
        }

    });

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ==================================================
   カテゴリ検索
================================================== */

function categorySearch(keyword){

    go("search");

    const input =
        document.getElementById("searchInput");

    input.value = keyword;

    filterResults();
}


/* ==================================================
   検索
================================================== */

function filterResults(){

    const input =
        document.getElementById("searchInput");

    if(!input) return;

    const keyword =
        input.value.toLowerCase();

    const results =
        document.querySelectorAll(".result");

    let count = 0;

    results.forEach(result => {

        const name =
            result.dataset.name.toLowerCase();

        if(
            keyword === "" ||
            name.includes(keyword)
        ){

            result.style.display = "flex";
            count++;

        }else{

            result.style.display = "none";

        }

    });

    document.getElementById("resultCount").textContent =
        "検索結果 / " + count;
}


/* ==================================================
   店舗詳細
================================================== */

let currentPlace = "○○ラーメン";
let currentPlaceScore = "4.8";

function openPlace(name, score){

    currentPlace = name;
    currentPlaceScore = score;

    document.getElementById("detailName").textContent =
        name;

    document.getElementById("detailScore").textContent =
        score;

    go("place");

    buildRatingSystem();
}


/* ==================================================
   ★ 評価する
================================================== */

function openRating(){

    const section =
        document.getElementById("ratingSection");

    if(!section) return;

    /*
       まず店舗詳細ページへ
    */

    go("place");

    /*
       少し待ってから評価欄へスクロール
    */

    setTimeout(() => {

        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 100);

}


/* ==================================================
   評価項目
================================================== */

const ratingItems = [

    "一人で入りやすい",
    "一人客の多さ",
    "過ごしやすさ",
    "静かさ",
    "一人席・カウンター",
    "店員さんの対応",
    "一人での居心地"

];


/* ==================================================
   保存済み評価
================================================== */

let myRatings =
    JSON.parse(
        localStorage.getItem(
            "ohitorisamap_ratings"
        ) || "{}"
    );


/* ==================================================
   現在入力中の評価
================================================== */

let currentRatings =
    [0,0,0,0,0,0,0];


/* ==================================================
   評価UI生成
================================================== */

function buildRatingSystem(){

    const container =
        document.getElementById("ratingItems");

    if(!container) return;

    container.innerHTML = "";

    /*
       以前評価していた場合は復元
    */

    if(myRatings[currentPlace]){

        currentRatings =
            [...myRatings[currentPlace]];

    }else{

        currentRatings =
            [0,0,0,0,0,0,0];

    }


    ratingItems.forEach((item,index) => {

        const row =
            document.createElement("div");

        row.className =
            "rating-item";


        const name =
            document.createElement("div");

        name.className =
            "rating-item-name";

        name.textContent =
            item;


        const stars =
            document.createElement("div");

        stars.className =
            "rating-stars";


        for(let i = 1; i <= 5; i++){

            const star =
                document.createElement("div");

            star.className =
                "star";

            star.textContent =
                "★";

            star.dataset.value =
                i;


            /*
               保存済み評価を表示
            */

            if(
                currentRatings[index] >= i
            ){

                star.classList.add("selected");

            }


            /*
               星を押したとき
            */

            star.onclick = () => {

                currentRatings[index] =
                    i;

                updateStars(index);

                updateTotal();

            };


            stars.appendChild(star);

        }


        row.appendChild(name);
        row.appendChild(stars);

        container.appendChild(row);

    });


    updateTotal();

}


/* ==================================================
   星表示更新
================================================== */

function updateStars(index){

    const rows =
        document.querySelectorAll(
            ".rating-item"
        );

    if(!rows[index]) return;

    const stars =
        rows[index].querySelectorAll(
            ".star"
        );


    stars.forEach((star,i) => {

        if(
            i + 1 <=
            currentRatings[index]
        ){

            star.classList.add(
                "selected"
            );

        }else{

            star.classList.remove(
                "selected"
            );

        }

    });

}


/* ==================================================
   総合スコア
================================================== */

function updateTotal(){

    const values =
        currentRatings.filter(
            value => value > 0
        );


    if(values.length === 0){

        document.getElementById(
            "ratingTotal"
        ).textContent = "0.0";

        return;

    }


    const total =
        values.reduce(
            (sum,value) =>
                sum + value,
            0
        );


    const average =
        total / values.length;


    document.getElementById(
        "ratingTotal"
    ).textContent =
        average.toFixed(1);

}


/* ==================================================
   評価保存
================================================== */

function saveRating(){

    /*
       全項目チェック
    */

    const incomplete =
        currentRatings.some(
            value => value === 0
        );


    if(incomplete){

        jarvisMessage(
            "評価入力が未完了です",
            "すべての項目を評価してください"
        );

        return;

    }


    /*
       保存
    */

    myRatings[currentPlace] =
        [...currentRatings];


    localStorage.setItem(
        "ohitorisamap_ratings",
        JSON.stringify(myRatings)
    );


    /*
       MY更新
    */

    updateMyRatingCount();


    /*
       JARVIS風通知
    */

    jarvisMessage(
        "評価を保存しました",
        currentPlace +
        " の評価データを更新しました"
    );

}


/* ==================================================
   JARVIS風通知
================================================== */

function jarvisMessage(title, message){

    /*
       既存通知があれば削除
    */

    const old =
        document.getElementById(
            "jarvisMessage"
        );

    if(old){
        old.remove();
    }


    const box =
        document.createElement("div");

    box.id =
        "jarvisMessage";


    box.innerHTML = `

        <div class="jarvis-line"></div>

        <div class="jarvis-title">
            ${title}
        </div>

        <div class="jarvis-message">
            ${message}
        </div>

    `;


    /*
       見た目は現在のUIに合わせる
    */

    Object.assign(
        box.style,
        {
            position:"fixed",
            right:"20px",
            bottom:"95px",
            zIndex:"9998",
            width:"min(340px, calc(100% - 40px))",
            padding:"18px 20px",
            background:"rgba(3,10,13,.94)",
            border:"1px solid rgba(70,220,255,.45)",
            boxShadow:
                "0 0 25px rgba(70,220,255,.12)",
            backdropFilter:"blur(12px)",
            animation:"pageIn .3s ease"
        }
    );


    const line =
        box.querySelector(
            ".jarvis-line"
        );

    Object.assign(
        line.style,
        {
            position:"absolute",
            left:"0",
            top:"0",
            bottom:"0",
            width:"2px",
            background:"#6de3ff",
            boxShadow:
                "0 0 10px #6de3ff"
        }
    );


    const titleEl =
        box.querySelector(
            ".jarvis-title"
        );

    Object.assign(
        titleEl.style,
        {
            color:"#6de3ff",
            fontSize:"10px",
            letterSpacing:"2px"
        }
    );


    const messageEl =
        box.querySelector(
            ".jarvis-message"
        );

    Object.assign(
        messageEl.style,
        {
            marginTop:"8px",
            color:"#78949d",
            fontSize:"9px",
            lineHeight:"1.8"
        }
    );


    document.body.appendChild(box);


    /*
       4秒後に消す
    */

    setTimeout(() => {

        box.style.opacity = "0";
        box.style.transform =
            "translateX(15px)";
        box.style.transition =
            ".4s ease";

        setTimeout(() => {
            box.remove();
        },400);

    },4000);

}


/* ==================================================
   お気に入り
================================================== */

let favorites =
    JSON.parse(
        localStorage.getItem(
            "ohitorisamap_favorites"
        ) || "[]"
    );


function toggleFavorite(){

    const index =
        favorites.indexOf(
            currentPlace
        );


    if(index === -1){

        favorites.push(
            currentPlace
        );

        jarvisMessage(
            "お気に入りに追加",
            currentPlace +
            " をお気に入りに登録しました"
        );

    }else{

        favorites.splice(
            index,
            1
        );

        jarvisMessage(
            "お気に入りから削除",
            currentPlace +
            " をお気に入りから削除しました"
        );

    }


    localStorage.setItem(
        "ohitorisamap_favorites",
        JSON.stringify(favorites)
    );


    /*
       MYの表示数
    */

    document.getElementById(
        "favoriteCount"
    ).textContent =
        favorites.length;

}


/* ==================================================
   MY一覧
================================================== */

function showMyList(type){

    const panel =
        document.getElementById(
            "myListPanel"
        );

    const title =
        document.getElementById(
            "myListTitle"
        );

    const list =
        document.getElementById(
            "myList"
        );


    panel.classList.add("show");

    list.innerHTML = "";


    let data = [];


    /* --------------------------
       お気に入り
    -------------------------- */

    if(type === "favorite"){

        title.textContent =
            "お気に入り一覧";

        data = favorites;

    }


    /* --------------------------
       評価した場所
    -------------------------- */

    if(type === "rating"){

        title.textContent =
            "評価した場所";

        data =
            Object.keys(myRatings);

    }


    /* --------------------------
       検索履歴
    -------------------------- */

    if(type === "search"){

        title.textContent =
            "検索した場所";

        data =
            JSON.parse(
                localStorage.getItem(
                    "ohitorisamap_search_history"
                ) || "[]"
            );

    }


    /* --------------------------
       行った場所
    -------------------------- */

    if(type === "visited"){

        title.textContent =
            "行った場所";

        data =
            JSON.parse(
                localStorage.getItem(
                    "ohitorisamap_visited"
                ) || "[]"
            );

    }


    /*
       データなし
    */

    if(data.length === 0){

        const empty =
            document.createElement("div");

        empty.style.padding =
            "25px 0";

        empty.style.color =
            "#527783";

        empty.style.fontSize =
            "9px";

        empty.textContent =
            "現在、登録されている場所はありません";

        list.appendChild(empty);

        return;

    }


    /*
       一覧作成
    */

    data.forEach(name => {

        const item =
            document.createElement("div");

        item.className =
            "my-list-item";


        item.onclick = () => {

            const score =
                getPlaceScore(name);

            openPlace(
                name,
                score
            );

        };


        const left =
            document.createElement("div");


        const nameEl =
            document.createElement("div");

        nameEl.className =
            "my-list-name";

        nameEl.textContent =
            name;


        const detail =
            document.createElement("div");

        detail.className =
            "my-list-detail";

        detail.textContent =
            "一人で行きやすい場所";


        left.appendChild(nameEl);
        left.appendChild(detail);


        const score =
            document.createElement("div");

        score.className =
            "my-list-score";


        score.textContent =
            getPlaceScore(name);


        item.appendChild(left);
        item.appendChild(score);


        list.appendChild(item);

    });

}


/* ==================================================
   店舗スコア
================================================== */

function getPlaceScore(name){

    const defaultScores = {

        "○○ラーメン":"4.8",
        "○○カフェ":"4.7",
        "○○温泉":"4.6",
        "○○映画館":"4.5"

    };


    return (
        defaultScores[name] ||
        "4.8"
    );

}


/* ==================================================
   検索履歴保存
================================================== */

function saveSearchHistory(name){

    if(!name) return;


    let history =
        JSON.parse(
            localStorage.getItem(
                "ohitorisamap_search_history"
            ) || "[]"
        );


    /*
       重複削除
    */

    history =
        history.filter(
            item => item !== name
        );


    /*
       最新を先頭
    */

    history.unshift(name);


    /*
       最大20件
    */

    history =
        history.slice(0,20);


    localStorage.setItem(
        "ohitorisamap_search_history",
        JSON.stringify(history)
    );

}


/* ==================================================
   行った場所保存
================================================== */

function saveVisitedPlace(name){

    if(!name) return;


    let visited =
        JSON.parse(
            localStorage.getItem(
                "ohitorisamap_visited"
            ) || "[]"
        );


    if(!visited.includes(name)){

        visited.push(name);

    }


    localStorage.setItem(
        "ohitorisamap_visited",
        JSON.stringify(visited)
    );

}


/* ==================================================
   ユーザー情報
================================================== */

function toggleUserPanel(){

    document
        .getElementById("userPanel")
        .classList.toggle("show");

}


/* ==================================================
   MY評価件数
================================================== */

function updateMyRatingCount(){

    const count =
        Object.keys(
            myRatings
        ).length;


    document.getElementById(
        "ratingCount"
    ).textContent =
        count;

}


/* ==================================================
   MYお気に入り件数
================================================== */

function updateFavoriteCount(){

    document.getElementById(
        "favoriteCount"
    ).textContent =
        favorites.length;

}


/* ==================================================
   店舗を開いたときに行った場所として記録
================================================== */

const originalOpenPlace =
    openPlace;


/*
   openPlace自体は上で定義済みなので、
   店舗詳細表示時に履歴だけ保存する
*/

function registerPlaceHistory(name){

    saveVisitedPlace(name);

}


/* ==================================================
   初期化
================================================== */

updateMyRatingCount();

updateFavoriteCount();

buildRatingSystem();


/* ==================================================
   検索結果クリック時の履歴
================================================== */

document.addEventListener(
    "click",
    function(event){

        const result =
            event.target.closest(".result");

        if(!result) return;

        const name =
            result.dataset.name;

        if(name){

            saveSearchHistory(name);

        }

    }
);


/* ==================================================
   評価画面を開いたときの状態確認
================================================== */

document.addEventListener(
    "click",
    function(event){

        const star =
            event.target.closest(".star");

        if(!star) return;

        /*
           星を押した瞬間に
           総合点が更新される
        */

        updateTotal();

    }
);

</script>
