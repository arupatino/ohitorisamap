<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひとりマップ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f7f7f7;
    color:#111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}

/* HEADER */

header{
    background:#fff;
    padding:28px 22px 24px;
    border-bottom:1px solid #e8e8e8;
}

.logo{
    font-size:24px;
    font-weight:700;
    letter-spacing:2px;
}

.catch{
    margin-top:8px;
    font-size:13px;
    color:#777;
    letter-spacing:1px;
}

/* MAIN */

main{
    max-width:650px;
    margin:auto;
    padding:24px 18px 60px;
}

/* SEARCH */

.search{
    background:#fff;
    border:1px solid #ddd;
    height:54px;
    border-radius:4px;
    display:flex;
    align-items:center;
    padding:0 16px;
}

.search-icon{
    width:17px;
    height:17px;
    border:1.5px solid #111;
    border-radius:50%;
    position:relative;
    margin-right:12px;
}

.search-icon:after{
    content:"";
    position:absolute;
    width:7px;
    height:1.5px;
    background:#111;
    right:-5px;
    bottom:-2px;
    transform:rotate(45deg);
}

.search input{
    border:0;
    outline:0;
    width:100%;
    font-size:15px;
    background:transparent;
}

/* SECTION */

.section-title{
    margin-top:38px;
    margin-bottom:18px;
}

.section-title h2{
    margin:0;
    font-size:19px;
    font-weight:600;
    letter-spacing:1px;
}

.section-title p{
    margin:6px 0 0;
    font-size:12px;
    color:#888;
}

/* CATEGORY */

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:#ddd;
    border:1px solid #ddd;
}

.category{
    background:#fff;
    min-height:95px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:12px;
    font-weight:500;
}

/* ICON BASE */

.icon{
    width:28px;
    height:28px;
    position:relative;
    display:block;
}

/* FOOD */

.food:before{
    content:"";
    position:absolute;
    left:6px;
    top:3px;
    width:2px;
    height:23px;
    background:#111;
    box-shadow:4px 0 0 #111;
}

.food:after{
    content:"";
    position:absolute;
    right:5px;
    top:5px;
    width:9px;
    height:15px;
    border:1.7px solid #111;
    border-radius:50%;
}

/* CAFE */

.cafe{
    width:21px;
    height:17px;
    border:1.7px solid #111;
    border-radius:2px 2px 6px 6px;
    margin-top:3px;
}

.cafe:before{
    content:"";
    position:absolute;
    left:4px;
    top:-6px;
    width:10px;
    height:5px;
    border-top:1.5px solid #111;
    border-radius:50%;
}

.cafe:after{
    content:"";
    position:absolute;
    right:-8px;
    top:3px;
    width:7px;
    height:8px;
    border:1.7px solid #111;
    border-left:0;
    border-radius:0 6px 6px 0;
}

/* MOVIE */

.movie{
    width:27px;
    height:20px;
    border:1.7px solid #111;
    border-radius:2px;
}

.movie:before{
    content:"";
    position:absolute;
    left:5px;
    top:6px;
    width:5px;
    height:5px;
    border:1.5px solid #111;
    border-radius:50%;
    box-shadow:10px 0 0 -1px #fff,
               10px 0 0 0 #111;
}

/* SPA */

.spa:before,
.spa:after{
    content:"";
    position:absolute;
    width:23px;
    height:10px;
    border-top:1.5px solid #111;
    border-radius:50%;
    left:2px;
}

.spa:before{
    top:6px;
}

.spa:after{
    top:14px;
}

/* KARAOKE */

.karaoke{
    width:17px;
    height:24px;
    border:1.7px solid #111;
    border-radius:50% 50% 45% 45%;
    margin-left:2px;
}

.karaoke:before{
    content:"";
    position:absolute;
    width:2px;
    height:8px;
    background:#111;
    left:6px;
    bottom:-7px;
}

.karaoke:after{
    content:"";
    position:absolute;
    width:11px;
    height:2px;
    background:#111;
    left:1px;
    bottom:-9px;
}

/* PLAY */

.play{
    border:1.7px solid #111;
    border-radius:50%;
}

.play:before{
    content:"";
    position:absolute;
    left:10px;
    top:7px;
    border-left:8px solid #111;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

/* CAR */

.car{
    width:29px;
    height:14px;
    border:1.7px solid #111;
    border-radius:4px;
    top:7px;
}

.car:before{
    content:"";
    position:absolute;
    width:13px;
    height:7px;
    border:1.7px solid #111;
    border-bottom:0;
    left:6px;
    top:-7px;
    border-radius:5px 5px 0 0;
}

.car:after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    border:1.5px solid #111;
    border-radius:50%;
    background:#fff;
    left:3px;
    bottom:-5px;
    box-shadow:15px 0 0 -1px #fff,
               15px 0 0 0 #111;
}

/* OUTDOOR / COMPASS */

.outdoor{
    border:1.7px solid #111;
    border-radius:50%;
}

.outdoor:before{
    content:"";
    position:absolute;
    width:2px;
    height:17px;
    background:#111;
    left:12px;
    top:4px;
    transform:rotate(45deg);
}

.outdoor:after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border:1.5px solid #111;
    left:9px;
    top:9px;
    transform:rotate(45deg);
}

/* MAP */

.map{
    height:280px;
    background:#e9e9e9;
    border:1px solid #ddd;
    position:relative;
    overflow:hidden;
}

.map-line{
    position:absolute;
    background:#d2d2d2;
}

.map-line.one{
    width:140%;
    height:1px;
    left:-20%;
    top:45%;
    transform:rotate(-12deg);
}

.map-line.two{
    width:1px;
    height:140%;
    left:55%;
    top:-20%;
    transform:rotate(20deg);
}

.map-line.three{
    width:120%;
    height:1px;
    left:-10%;
    top:70%;
    transform:rotate(8deg);
}

.map-pin{
    position:absolute;
    width:18px;
    height:18px;
    border:2px solid #111;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    left:50%;
    top:50%;
}

.map-pin:after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    background:#111;
    border-radius:50%;
    left:5px;
    top:5px;
}

.map-text{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:#fff;
    padding:9px 15px;
    font-size:11px;
    letter-spacing:1px;
    z-index:2;
}

/* LOCATION */

.location{
    width:100%;
    height:50px;
    margin-top:10px;
    background:#111;
    color:#fff;
    border:0;
    font-size:14px;
    letter-spacing:1px;
}

/* PLACE */

.place{
    background:#fff;
    border:1px solid #e2e2e2;
    margin-top:12px;
    padding:20px;
}

.place-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.place-name{
    font-size:17px;
    font-weight:600;
}

.score{
    font-size:20px;
    font-weight:700;
}

.score span{
    display:block;
    font-size:10px;
    color:#999;
    font-weight:400;
    margin-top:2px;
}

.status{
    margin-top:15px;
    padding:10px;
    background:#f3f3f3;
    font-size:12px;
}

.details{
    display:flex;
    gap:15px;
    margin-top:15px;
    font-size:11px;
    color:#666;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px;
    color:#aaa;
    font-size:10px;
    letter-spacing:2px;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        ひとりマップ
    </div>

    <div class="catch">
        一人の時間を、もっと自由に。
    </div>

</header>


<main>

    <div class="search">

        <div class="search-icon"></div>

        <input
            type="text"
            placeholder="行きたい場所を検索"
        >

    </div>


    <div class="section-title">

        <h2>一人で、何する？</h2>

        <p>目的から探す</p>

    </div>


    <div class="categories">

        <div class="category">
            <div class="icon food"></div>
            食事
        </div>

        <div class="category">
            <div class="icon cafe"></div>
            カフェ
        </div>

        <div class="category">
            <div class="icon movie"></div>
            映画
        </div>

        <div class="category">
            <div class="icon spa"></div>
            温泉
        </div>

        <div class="category">
            <div class="icon karaoke"></div>
            カラオケ
        </div>

        <div class="category">
            <div class="icon play"></div>
            遊ぶ
        </div>

        <div class="category">
            <div class="icon car"></div>
            ドライブ
        </div>

        <div class="category">
            <div class="icon outdoor"></div>
            お出かけ
        </div>

    </div>


    <div class="section-title">

        <h2>近くから探す</h2>

        <p>現在地周辺のスポット</p>

    </div>


    <div class="map">

        <div class="map-line one"></div>
        <div class="map-line two"></div>
        <div class="map-line three"></div>

        <div class="map-pin"></div>

        <div class="map-text">
            地図を表示
        </div>

    </div>


    <button class="location">
        現在地から探す
    </button>


    <div class="section-title">

        <h2>一人で人気の場所</h2>

        <p>一人で行きやすいスポット</p>

    </div>


    <div class="place">

        <div class="place-top">

            <div class="place-name">
                ○○ラーメン
            </div>

            <div class="score">
                4.8
                <span>一人利用スコア</span>
            </div>

        </div>

        <div class="status">
            一人でかなり行きやすい
        </div>

        <div class="details">
            <span>一人客：多い</span>
            <span>カウンター：あり</span>
        </div>

    </div>


    <div class="place">

        <div class="place-top">

            <div class="place-name">
                ○○カフェ
            </div>

            <div class="score">
                4.7
                <span>一人利用スコア</span>
            </div>

        </div>

        <div class="status">
            静かに過ごしやすい
        </div>

        <div class="details">
            <span>一人客：多い</span>
            <span>Wi-Fi：あり</span>
        </div>

    </div>

</main>


<footer>
    ひとりマップ
</footer>

</body>
</html>
