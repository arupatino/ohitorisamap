<script>

/* ==================================================
   OHITORISAMAP SYSTEM
   LOCAL DATA ENGINE
================================================== */

/* ------------------------------
   DATA
------------------------------ */

const spots = [

    {
        id:"001",
        name:"○○ラーメン",
        category:"食事",
        score:4.8,
        distance:"1.2 KM",
        tags:["一人客 多","カウンターあり"]
    },

    {
        id:"002",
        name:"○○カフェ",
        category:"カフェ",
        score:4.7,
        distance:"2.4 KM",
        tags:["静か","Wi-Fiあり"]
    },

    {
        id:"003",
        name:"○○映画館",
        category:"映画",
        score:4.6,
        distance:"1.8 KM",
        tags:["一人利用 多","座席広め"]
    },

    {
        id:"004",
        name:"○○温泉",
        category:"温泉",
        score:4.6,
        distance:"3.1 KM",
        tags:["一人利用 多","休憩スペース"]
    },

    {
        id:"005",
        name:"○○カラオケ",
        category:"カラオケ",
        score:4.5,
        distance:"2.0 KM",
        tags:["一人利用歓迎","個室"]
    },

    {
        id:"006",
        name:"○○アミューズメント",
        category:"遊ぶ",
        score:4.4,
        distance:"2.8 KM",
        tags:["一人でもOK","長時間利用"]
    },

    {
        id:"007",
        name:"○○ドライブスポット",
        category:"ドライブ",
        score:4.7,
        distance:"4.2 KM",
        tags:["景色が良い","駐車場あり"]
    },

    {
        id:"008",
        name:"○○観光スポット",
        category:"お出かけ",
        score:4.5,
        distance:"4.8 KM",
        tags:["一人旅向き","写真映え"]
    }

];


/* ------------------------------
   STORAGE
------------------------------ */

const STORAGE_KEY =
    "ohitorisamap_data";


let userData =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || {

        favorites:[],
        visited:[],
        ratings:{},
        history:[],
        searches:[]

    };


function saveData(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(userData)

    );

}


/* ------------------------------
   SYSTEM MESSAGE
------------------------------ */

function systemMessage(text){

    const message =
        document.createElement("div");

    message.textContent = text;

    message.style.position =
        "fixed";

    message.style.left =
        "50%";

    message.style.bottom =
        "95px";

    message.style.transform =
        "translateX(-50%)";

    message.style.zIndex =
        "9999";

    message.style.padding =
        "12px 20px";

    message.style.border =
        "1px solid rgba(109,227,255,.5)";

    message.style.background =
        "rgba(3,8,11,.95)";

    message.style.color =
        "#6de3ff";

    message.style.fontSize =
        "9px";

    message.style.letterSpacing =
        "2px";

    message.style.boxShadow =
        "0 0 25px rgba(70,220,255,.15)";

    document.body.appendChild(message);


    setTimeout(() => {

        message.style.opacity = "0";

        message.style.transition =
            "opacity .4s";

        setTimeout(
            () => message.remove(),
            400
        );

    },1800);

}


/* ------------------------------
   FIND SPOT
------------------------------ */

function getSpot(id){

    return spots.find(
        spot => spot.id === id
    );

}


/* ------------------------------
   HISTORY
------------------------------ */

function addHistory(id){

    userData.history =
        userData.history.filter(
            x => x !== id
        );

    userData.history.unshift(id);

    userData.history =
        userData.history.slice(0,20);

    saveData();

}


/* ------------------------------
   SEARCH HISTORY
------------------------------ */

function addSearchHistory(keyword){

    if(!keyword.trim()) return;

    userData.searches =
        userData.searches.filter(
            x => x !== keyword
        );

    userData.searches.unshift(keyword);

    userData.searches =
        userData.searches.slice(0,20);

    saveData();

}


/* ==================================================
   SEARCH
================================================== */

function performSearch(keyword){

    keyword =
        keyword.trim();

    if(!keyword){

        systemMessage(
            "SEARCH QUERY REQUIRED"
        );

        return;

    }


    addSearchHistory(keyword);


    const results =
        spots.filter(spot =>

            spot.name.includes(keyword) ||

            spot.category.includes(keyword) ||

            spot.tags.some(
                tag => tag.includes(keyword)
            )

        );


    renderSearchResults(
        results,
        keyword
    );


    go("search");

}


/* ------------------------------
   SEARCH RESULT
------------------------------ */

function renderSearchResults(
    results,
    keyword
){

    const area =
        document.querySelector(
            "#search .search-results"
        );

    if(!area) return;


    area.innerHTML = "";


    const count =
        document.createElement("div");

    count.className =
        "result-count";

    count.textContent =
        `検索結果 / ${String(results.length).padStart(2,"0")}`;

    area.appendChild(count);


    if(results.length === 0){

        const empty =
            document.createElement("div");

        empty.className =
            "result";

        empty.innerHTML =

            `<div>

                <div class="result-name">
                    該当する場所がありません
                </div>

                <div class="result-info">
                    「${keyword}」に一致する場所を検索できませんでした
                </div>

            </div>`;

        area.appendChild(empty);

        return;

    }


    results.forEach(
        spot => {

            const result =
                document.createElement("div");

            result.className =
                "result";

            result.innerHTML =

                `<div>

                    <div class="result-name">
                        ${spot.name}
                    </div>

                    <div class="result-info">
                        ${spot.category}
                       　｜　
                        ${spot.tags.join("　｜　")}
                    </div>

                </div>

                <div class="result-score">
                    ${spot.score}
                </div>`;


            result.onclick = () => {

                openSpot(spot.id);

            };


            area.appendChild(result);

        }
    );

}


/* ==================================================
   CATEGORY
================================================== */

function searchCategory(category){

    const results =
        spots.filter(
            spot =>
                spot.category === category
        );


    addSearchHistory(category);


    renderSearchResults(
        results,
        category
    );


    go("search");


    systemMessage(
        `CATEGORY : ${category}`
    );

}


/* ==================================================
   PLACE DETAIL
================================================== */

function openSpot(id){

    const spot =
        getSpot(id);

    if(!spot) return;


    window.currentSpot =
        spot;


    addHistory(id);


    updatePlacePage(spot);


    go("place");

}


/* ------------------------------
   PLACE PAGE
------------------------------ */

function updatePlacePage(spot){

    const page =
        document.getElementById("place");

    if(!page) return;


    const name =
        page.querySelector(
            ".detail-name"
        );

    const location =
        page.querySelector(
            ".detail-location"
        );

    const score =
        page.querySelector(
            ".big-score"
        );

    const easy =
        page.querySelector(
            ".detail-score-box .easy"
        );


    if(name)
        name.textContent =
            spot.name;


    if(location)
        location.textContent =
            `現在地から ${spot.distance}`;


    if(score)
        score.textContent =
            spot.score;


    if(easy)
        easy.textContent =
            "一人向き";


    updateActionButtons(
        spot.id
    );

}


/* ==================================================
   FAVORITE
================================================== */

function toggleFavorite(){

    if(!window.currentSpot)
        return;


    const id =
        window.currentSpot.id;


    const index =
        userData.favorites.indexOf(id);


    if(index === -1){

        userData.favorites.push(id);

        systemMessage(
            "FAVORITE ADDED"
        );

    }else{

        userData.favorites.splice(
            index,
            1
        );

        systemMessage(
            "FAVORITE REMOVED"
        );

    }


    saveData();

    updateActionButtons(id);

    updateMySpace();

}


/* ==================================================
   VISITED
================================================== */

function toggleVisited(){

    if(!window.currentSpot)
        return;


    const id =
        window.currentSpot.id;


    const index =
        userData.visited.indexOf(id);


    if(index === -1){

        userData.visited.push(id);

        systemMessage(
            "VISITED RECORDED"
        );

    }else{

        userData.visited.splice(
            index,
            1
        );

        systemMessage(
            "VISITED REMOVED"
        );

    }


    saveData();

    updateActionButtons(id);

    updateMySpace();

}


/* ==================================================
   RATING
================================================== */

function rateSpot(){

    if(!window.currentSpot)
        return;


    const value =
        prompt(
            "この場所を5段階で評価してください\n\n1 ～ 5"
        );


    if(value === null)
        return;


    const rating =
        Number(value);


    if(
        !Number.isInteger(rating) ||
        rating < 1 ||
        rating > 5
    ){

        systemMessage(
            "INVALID RATING"
        );

        return;

    }


    userData.ratings[
        window.currentSpot.id
    ] = rating;


    saveData();


    systemMessage(
        `RATING SAVED : ${rating} / 5`
    );


    updateMySpace();

}


/* ==================================================
   ACTION BUTTONS
================================================== */

function updateActionButtons(id){

    const page =
        document.getElementById("place");

    if(!page) return;


    const actions =
        page.querySelectorAll(
            ".action"
        );


    if(actions.length < 3)
        return;


    const favorite =
        userData.favorites.includes(id);


    const visited =
        userData.visited.includes(id);


    actions[0].textContent =
        favorite
        ? "♥ お気に入り済"
        : "♡ お気に入り";


    actions[1].textContent =
        userData.ratings[id]
        ? `★ ${userData.ratings[id]} / 5`
        : "★ 評価する";


    actions[2].textContent =
        visited
        ? "✓ 行った"
        : "⌖ 行った・ルート";


    actions[0].onclick =
        toggleFavorite;


    actions[1].onclick =
        rateSpot;


    actions[2].onclick =
        () => {

            if(!visited){

                toggleVisited();

            }else{

                openRoute();

            }

        };

}


/* ==================================================
   ROUTE
================================================== */

function openRoute(){

    if(!window.currentSpot)
        return;


    const spot =
        window.currentSpot;


    const query =
        encodeURIComponent(
            spot.name
        );


    const url =
        `https://www.google.com/maps/search/?api=1&query=${query}`;


    window.open(
        url,
        "_blank"
    );


    systemMessage(
        "MAP ROUTE SYSTEM"
    );

}


/* ==================================================
   CURRENT LOCATION
================================================== */

function getCurrentLocation(){

    if(!navigator.geolocation){

        systemMessage(
            "LOCATION NOT SUPPORTED"
        );

        return;

    }


    systemMessage(
        "LOCATION SCANNING..."
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            localStorage.setItem(
                "ohitorisamap_location",
                JSON.stringify({
                    lat,
                    lon
                })
            );


            systemMessage(
                "LOCATION ACQUIRED"
            );


            updateLocationDisplay(
                lat,
                lon
            );

        },

        () => {

            systemMessage(
                "LOCATION ACCESS DENIED"
            );

        },

        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:60000

        }

    );

}


/* ==================================================
   LOCATION DISPLAY
================================================== */

function updateLocationDisplay(
    lat,
    lon
){

    const info =
        document.querySelector(
            "#map .radar-info"
        );


    if(!info)
        return;


    info.innerHTML =

        `現在地<br>
         LOCATION : LOCKED<br>
         GPS : ACTIVE`;

}


/* ==================================================
   MY SPACE
================================================== */

function updateMySpace(){

    const page =
        document.getElementById("my");

    if(!page) return;


    const cards =
        page.querySelectorAll(
            ".my-card-number"
        );


    if(cards.length >= 4){

        cards[0].textContent =
            userData.history.length;


        cards[1].textContent =
            userData.favorites.length;


        cards[2].textContent =
            Object.keys(
                userData.ratings
            ).length;


        cards[3].textContent =
            userData.visited.length;

    }


    const history =
        page.querySelector(
            ".history"
        );


    if(!history)
        return;


    history.innerHTML = "";


    userData.history
        .slice(0,10)
        .forEach(id => {

            const spot =
                getSpot(id);

            if(!spot)
                return;


            const item =
                document.createElement("div");

            item.className =
                "history-item";


            item.innerHTML =

                `<div class="history-name">
                    ${spot.name}
                </div>

                <div class="history-date">
                    ${spot.category}
                </div>`;


            item.onclick = () =>
                openSpot(id);


            history.appendChild(item);

        });


    if(userData.history.length === 0){

        history.innerHTML =

            `<div class="history-item">

                <div class="history-name">
                    まだ履歴がありません
                </div>

                <div class="history-date">
                    NO DATA
                </div>

            </div>`;

    }

}


/* ==================================================
   NAVIGATION
================================================== */

function go(pageName){

    const pages =
        document.querySelectorAll(
            ".page"
        );


    pages.forEach(page => {

        page.classList.remove(
            "active"
        );

    });


    const target =
        document.getElementById(
            pageName
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    const buttons =
        document.querySelectorAll(
            ".nav-button"
        );


    buttons.forEach(button => {

        button.classList.remove(
            "active"
        );


        if(
            button.dataset.page ===
            pageName
        ){

            button.classList.add(
                "active"
            );

        }

    });


    if(pageName === "my"){

        updateMySpace();

    }


    if(pageName === "map"){

        setTimeout(
            getCurrentLocation,
            300
        );

    }


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==================================================
   SEARCH INPUT CONNECTION
================================================== */

function setupSearch(){

    const homeInput =
        document.querySelector(
            "#home .search-box input"
        );


    const searchInput =
        document.querySelector(
            "#search .search-large input"
        );


    if(homeInput){

        homeInput.onclick =
            null;


        homeInput.addEventListener(
            "keydown",
            event => {

                if(
                    event.key === "Enter"
                ){

                    event.preventDefault();

                    performSearch(
                        homeInput.value
                    );

                }

            }
        );

    }


    if(searchInput){

        searchInput.addEventListener(
            "keydown",
            event => {

                if(
                    event.key === "Enter"
                ){

                    event.preventDefault();

                    performSearch(
                        searchInput.value
                    );

                }

            }
        );

    }

}


/* ==================================================
   CATEGORY CONNECTION
================================================== */

function setupCategories(){

    const categories =
        document.querySelectorAll(
            "#home .category"
        );


    categories.forEach(
        category => {

            category.addEventListener(
                "click",
                () => {

                    const name =
                        category
                            .querySelector(
                                ".category-name"
                            )
                            ?.textContent
                            .trim();


                    if(name){

                        searchCategory(
                            name
                        );

                    }

                }
            );

        }
    );

}


/* ==================================================
   BOOT SEQUENCE
================================================== */

const bootStatus =
    document.getElementById(
        "bootStatus"
    );

const boot =
    document.getElementById(
        "boot"
    );

const access =
    document.getElementById(
        "access"
    );

const app =
    document.getElementById(
        "app"
    );


const sequence = [

    [
        0,
        "SYSTEM LOCKED",
        "システムを確認しています"
    ],

    [
        800,
        "AUTHENTICATING",
        "接続を確認しています"
    ],

    [
        1600,
        "ACCESS CHECK",
        "アクセスを確認しています"
    ],

    [
        2200,
        "ACCESS GRANTED",
        "アクセスを許可しました"
    ]

];


sequence.forEach(item => {

    setTimeout(() => {

        bootStatus.innerHTML =

            item[1] +

            '<span class="boot-jp">' +

            item[2] +

            '</span>';

    },item[0]);

});


setTimeout(() => {

    access.classList.add(
        "show"
    );

},2500);


setTimeout(() => {

    app.classList.add(
        "show"
    );

},3300);


setTimeout(() => {

    boot.classList.add(
        "hide"
    );

},3900);


/* ==================================================
   INITIALIZE
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        setupSearch();

        setupCategories();

        updateMySpace();

        systemMessage(
            "OHITORISAMAP SYSTEM READY"
        );

    }
);

</script>
